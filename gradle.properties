# Offline map distribution the app downloads regional packages from. The API
# origin is already the staging environment (ApiEnvironment.STAGING), so every
# build, release included, must point at the same signed staging distribution;
# without these values the map shows "No offline package" and offers no
# download. The key is the public Ed25519 verification key (key id
# staging-20261027); the private signing key never leaves the operator's
# machine. Override both with -P for another certified distribution.
mapDistBaseUrl=https://teste.abastevo.com.br
mapDistKeys=staging-20261027:V1obkY75HCla-dgaM6Eywo5pWV939unuu8CIt1JDddY
