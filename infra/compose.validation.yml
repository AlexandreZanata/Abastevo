# Disposable validation only: no persistent volumes, no shared dev database.
name: ${ANPFUEL_VALIDATION_PROJECT:?Set a unique local validation project}
services:
  db:
    image: postgis/postgis:18-3.6@sha256:60f6ad1d21ea86a67d47780b9a0d1e1d200500f62b19293fa834d0dea80b8677
    environment:
      POSTGRES_USER: anpfuel
      POSTGRES_PASSWORD: anpfuel
      POSTGRES_DB: anpfuel
      PGDATA: /var/lib/postgresql/data/pgdata
    ports: ["127.0.0.1::5432"]
    tmpfs: [/var/lib/postgresql/data]
    mem_limit: 1g
    cpus: 4
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anpfuel -d anpfuel"]
      interval: 1s
      timeout: 3s
      retries: 30
  storage:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: localvalidation
      MINIO_ROOT_PASSWORD: local-validation-only-20260930
    ports: ["127.0.0.1::9000"]
    tmpfs: [/data]
    mem_limit: 512m
    cpus: 2
  storage-init:
    image: bitnamilegacy/minio-client@sha256:00dcc4e58ada0df45bb7d9ee435af98295f96c27c3c68292ce78ec700a87b511
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        for i in $$(seq 1 30); do
          if mc alias set local http://storage:9000 localvalidation local-validation-only-20260930 >/dev/null 2>&1 && mc mb --ignore-existing local/validation-private; then
            exit 0
          fi
          sleep 1
        done
        exit 1
    depends_on: [storage]
    profiles: [init]
