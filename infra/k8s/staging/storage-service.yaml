{
  "apiVersion": "v1",
  "kind": "Service",
  "metadata": {
    "name": "abastevo-temp-storage",
    "namespace": "abastevo-temp"
  },
  "spec": {
    "type": "ClusterIP",
    "selector": {
      "app": "abastevo-temp-storage"
    },
    "ports": [
      {
        "name": "s3",
        "port": 9000,
        "targetPort": "s3",
        "protocol": "TCP"
      }
    ]
  }
}
