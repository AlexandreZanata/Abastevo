{
  "apiVersion": "v1",
  "kind": "ConfigMap",
  "metadata": {
    "name": "abastevo-temp-storage-start",
    "namespace": "abastevo-temp"
  },
  "data": {
    "start.sh": "#!/bin/sh\nset -eu\numask 077\nrm -f /tmp/abastevo-storage-ready\nexport MC_CONFIG_DIR=/tmp/abastevo-mc\nminio server /data --address :9000 --console-address 127.0.0.1:9001 &\nstorage_pid=$!\ntrap 'kill -TERM \"$storage_pid\" 2>/dev/null || true; wait \"$storage_pid\" || true' TERM INT EXIT\nready=0\nfor _attempt in $(seq 1 45); do\n  if mc alias set owned http://127.0.0.1:9000 \"$MINIO_ROOT_USER\" \"$MINIO_ROOT_PASSWORD\" >/dev/null 2>&1; then ready=1; break; fi\n  sleep 1\ndone\n[ \"$ready\" = 1 ]\nmc mb --ignore-existing owned/abastevo-dev-photos >/dev/null\nmc anonymous set none owned/abastevo-dev-photos >/dev/null\ncat > /tmp/abastevo-policy.json <<'JSON'\n{\"Version\":\"2012-10-17\",\"Statement\":[{\"Effect\":\"Allow\",\"Action\":[\"s3:GetBucketLocation\",\"s3:ListBucket\",\"s3:ListBucketMultipartUploads\"],\"Resource\":[\"arn:aws:s3:::abastevo-dev-photos\"]},{\"Effect\":\"Allow\",\"Action\":[\"s3:GetObject\",\"s3:PutObject\",\"s3:DeleteObject\",\"s3:AbortMultipartUpload\",\"s3:ListMultipartUploadParts\"],\"Resource\":[\"arn:aws:s3:::abastevo-dev-photos/*\"]}]}\nJSON\nmc admin policy create owned abastevo-private /tmp/abastevo-policy.json >/dev/null\nmc admin user add owned \"$ANPFUEL_R2_ACCESS_KEY_ID\" \"$ANPFUEL_R2_SECRET_ACCESS_KEY\" >/dev/null\nmc admin policy attach owned abastevo-private --user \"$ANPFUEL_R2_ACCESS_KEY_ID\" >/dev/null\nmc ilm rule add owned/abastevo-dev-photos --expire-days 1 >/dev/null\ntouch /tmp/abastevo-storage-ready\nwait \"$storage_pid\"\n"
  }
}
