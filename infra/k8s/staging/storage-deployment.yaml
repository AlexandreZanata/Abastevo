{
  "apiVersion": "apps/v1",
  "kind": "Deployment",
  "metadata": {
    "name": "abastevo-temp-storage",
    "namespace": "abastevo-temp"
  },
  "spec": {
    "replicas": 1,
    "strategy": {
      "type": "Recreate"
    },
    "revisionHistoryLimit": 3,
    "selector": {
      "matchLabels": {
        "app": "abastevo-temp-storage"
      }
    },
    "template": {
      "metadata": {
        "labels": {
          "app": "abastevo-temp-storage"
        }
      },
      "spec": {
        "terminationGracePeriodSeconds": 60,
        "containers": [
          {
            "env": [
              {
                "name": "GOMEMLIMIT",
                "value": "384MiB"
              },
              {
                "name": "MINIO_ROOT_USER",
                "valueFrom": {
                  "secretKeyRef": {
                    "name": "abastevo-temp-secrets",
                    "key": "MINIO_ROOT_USER"
                  }
                }
              },
              {
                "name": "MINIO_ROOT_PASSWORD",
                "valueFrom": {
                  "secretKeyRef": {
                    "name": "abastevo-temp-secrets",
                    "key": "MINIO_ROOT_PASSWORD"
                  }
                }
              },
              {
                "name": "ANPFUEL_R2_ACCESS_KEY_ID",
                "valueFrom": {
                  "secretKeyRef": {
                    "name": "abastevo-temp-secrets",
                    "key": "ANPFUEL_R2_ACCESS_KEY_ID"
                  }
                }
              },
              {
                "name": "ANPFUEL_R2_SECRET_ACCESS_KEY",
                "valueFrom": {
                  "secretKeyRef": {
                    "name": "abastevo-temp-secrets",
                    "key": "ANPFUEL_R2_SECRET_ACCESS_KEY"
                  }
                }
              }
            ],
            "image": "${PRIVATE_STORAGE_IMAGE}",
            "imagePullPolicy": "Never",
            "name": "private-storage",
            "readinessProbe": {
              "exec": {
                "command": [
                  "/bin/sh",
                  "-c",
                  "test -f /tmp/abastevo-storage-ready"
                ]
              },
              "failureThreshold": 3,
              "initialDelaySeconds": 5,
              "periodSeconds": 5,
              "successThreshold": 1,
              "timeoutSeconds": 1
            },
            "resources": {
              "limits": {
                "cpu": "500m",
                "memory": "1Gi"
              },
              "requests": {
                "cpu": "50m",
                "memory": "256Mi"
              }
            },
            "securityContext": {
              "allowPrivilegeEscalation": false
            },
            "terminationMessagePath": "/dev/termination-log",
            "terminationMessagePolicy": "File",
            "volumeMounts": [
              {
                "mountPath": "/data",
                "name": "dev-private-media"
              },
              {
                "name": "storage-start",
                "mountPath": "/etc/abastevo-storage",
                "readOnly": true
              }
            ],
            "command": [
              "/bin/sh",
              "/etc/abastevo-storage/start.sh"
            ],
            "ports": [
              {
                "name": "s3",
                "containerPort": 9000
              }
            ]
          }
        ],
        "volumes": [
          {
            "name": "dev-private-media",
            "hostPath": {
              "path": "${PRIVATE_MEDIA_PATH}",
              "type": "Directory"
            }
          },
          {
            "name": "storage-start",
            "configMap": {
              "name": "abastevo-temp-storage-start"
            }
          }
        ]
      }
    }
  }
}
