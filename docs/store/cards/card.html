<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<!-- Store card template rendered by build_cards.py (string.Template placeholders filled per card). -->
<style>
  @font-face { font-family: "Manrope"; font-weight: 800; src: url("$font_manrope_extrabold"); }
  :root {
    --s: $scale;
    --mint: #63e7a4;
  }
  html, body { margin: 0; width: ${width}px; height: ${height}px; overflow: hidden; }
  body {
    position: relative;
    font-family: "Manrope", sans-serif;
    background:
      radial-gradient(ellipse 75% 42% at 96% 4%, rgba(0, 82, 247, 0.58), transparent 72%),
      radial-gradient(ellipse 70% 38% at 0% 100%, rgba(99, 231, 164, 0.30), transparent 72%),
      linear-gradient(165deg, #0d1d57 0%, #081338 50%, #050b22 100%);
  }
  .head {
    position: absolute;
    top: calc(84px * var(--s));
    left: calc(72px * var(--s));
    right: calc(72px * var(--s));
    text-align: center;
  }
  .icon {
    display: block;
    width: calc(72px * var(--s));
    height: calc(72px * var(--s));
    margin: 0 auto calc(26px * var(--s));
    border-radius: 22%;
    box-shadow: 0 calc(8px * var(--s)) calc(24px * var(--s)) rgba(0, 0, 0, 0.35);
  }
  h1 {
    margin: 0;
    color: #ffffff;
    font-weight: 800;
    font-size: calc(68px * var(--s));
    line-height: 1.12;
    letter-spacing: -0.02em;
    text-wrap: balance;
  }
  h1 em { font-style: normal; color: var(--mint); }
  .shot {
    position: absolute;
    top: calc(388px * var(--s));
    left: 50%;
    transform: translateX(-50%);
    width: calc(880px * var(--s));
    border-radius: calc(46px * var(--s));
    overflow: hidden;
    box-shadow:
      0 calc(40px * var(--s)) calc(90px * var(--s)) rgba(0, 0, 0, 0.55),
      0 0 0 calc(3px * var(--s)) rgba(255, 255, 255, 0.16);
  }
  .shot img { display: block; width: 100%; }
</style>
</head>
<body>
  <div class="head">
    <img class="icon" src="$icon" alt="">
    <h1>$headline</h1>
  </div>
  <div class="shot"><img src="$shot" alt=""></div>
</body>
</html>
