<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1796" viewBox="0 0 1280 1796" role="img" aria-labelledby="t d"><title id="t">Wireframe da landing abastevo em 1280 px</title><desc id="d">Baixa fidelidade: header, introdução com comparação ilustrativa Comunidade e ANP, como funciona, para quem é, o projeto com privacidade em resumo, aplicativo, perguntas e rodapé.</desc><rect width="1280" height="1796" fill="#ffffff"/><text x="160" y="14" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="400" fill="#7b87a3" text-anchor="start">WIREFRAME 1280 px · baixa fidelidade · conteúdo e hierarquia, não estilo final · largura de conteúdo ≈ 960 px</text><rect x="0" y="24" width="1280" height="72" rx="0" fill="#f5f8fc"/><rect x="160" y="44" width="32" height="32" rx="6" fill="none" stroke="#7b87a3" stroke-width="1" stroke-dasharray="5 4"/><text x="176.0" y="65.76" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="700" fill="#0042c5" text-anchor="middle">A</text><text x="204" y="68" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#0b1849" text-anchor="start">abastevo</text><text x="790" y="67" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500" fill="#0042c5" text-anchor="start" text-decoration="underline">Como funciona</text><text x="930" y="67" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500" fill="#0042c5" text-anchor="start" text-decoration="underline">O projeto</text><text x="1030" y="67" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500" fill="#0042c5" text-anchor="start" text-decoration="underline">Aplicativo</text><text x="160" y="166" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="700" fill="#0b1849" text-anchor="start">abastevo: preços de</text><text x="160" y="218" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="700" fill="#0b1849" text-anchor="start">combustíveis com a</text><text x="160" y="270" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="700" fill="#0b1849" text-anchor="start">comunidade</text><text x="160" y="336" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400" fill="#44506b" text-anchor="start">Um projeto de código aberto para consultar preços de</text><text x="160" y="364" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400" fill="#44506b" text-anchor="start">combustíveis em postos brasileiros, com a fonte e a</text><text x="160" y="392" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400" fill="#44506b" text-anchor="start">data de cada informação sempre visíveis. Comunidade</text><text x="160" y="420" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400" fill="#44506b" text-anchor="start">e ANP aparecem separadas: uma nunca substitui a</text><text x="160" y="448" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400" fill="#44506b" text-anchor="start">outra.</text><text x="160" y="490" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#0b1849" text-anchor="start">Em desenvolvimento. O aplicativo para Android ainda não foi publicado.</text><rect x="160" y="520" width="160" height="48" rx="8" fill="none" stroke="#0042c5" stroke-width="2"/><text x="240" y="551" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#0042c5" text-anchor="middle">Ver no GitHub</text><text x="344" y="551" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500" fill="#44506b" text-anchor="start">Em breve na Google Play</text><rect x="680" y="152" width="190" height="22" rx="11" fill="#fff3dc"/><text x="775" y="168" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#7a4b00" text-anchor="middle">Exemplo ilustrativo · dados fictícios</text><rect x="680" y="188" width="440" height="116" rx="12" fill="#ffffff" stroke="#7b87a3" stroke-width="1"/><rect x="696" y="202" width="120" height="24" rx="12" fill="#e9f0ff"/><text x="756" y="219" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#0042c5" text-anchor="middle">Comunidade</text><text x="696" y="256" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#0b1849" text-anchor="start">Gasolina comum · Posto Exemplo</text><text x="1104" y="256" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#0b1849" text-anchor="end">R$ X,XX</text><text x="696" y="278" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#44506b" text-anchor="start">Observação enviada por pessoa</text><text x="696" y="294" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#44506b" text-anchor="start">há algumas horas · apoio visível</text><rect x="680" y="316" width="440" height="116" rx="12" fill="#ffffff" stroke="#7b87a3" stroke-width="1"/><rect x="696" y="330" width="120" height="24" rx="12" fill="#e8f6ef"/><text x="756" y="347" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#03664b" text-anchor="middle">Referência ANP</text><text x="696" y="384" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#0b1849" text-anchor="start">Gasolina comum · Posto Exemplo</text><text x="1104" y="384" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#0b1849" text-anchor="end">R$ X,XX</text><text x="696" y="406" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#44506b" text-anchor="start">Levantamento publicado pela ANP</text><text x="696" y="422" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#44506b" text-anchor="start">semana da pesquisa · não é preço da bomba agora</text><text x="160" y="592" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="400" fill="#7b87a3" text-anchor="start">comparação ilustrativa na dobra superior (diferencial do produto)</text><text x="160" y="634" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700" fill="#0b1849" text-anchor="start">Como funciona</text><rect x="160" y="664" width="304" height="130" rx="12" fill="none" stroke="#7b87a3" stroke-width="1"/><text x="180" y="700" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="700" fill="#0042c5" text-anchor="start">1  Consulte</text><text x="180" y="728" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#44506b" text-anchor="start">Escolha cidade e combustível e veja</text><text x="180" y="748" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#44506b" text-anchor="start">os preços disponíveis, cada um com</text><text x="180" y="768" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#44506b" text-anchor="start">fonte, data e condição.</text><rect x="488" y="664" width="304" height="130" rx="12" fill="none" stroke="#7b87a3" stroke-width="1"/><text x="508" y="700" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="700" fill="#0042c5" text-anchor="start">2  Confira</text><text x="508" y="728" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#44506b" text-anchor="start">Veja se o preço vem da comunidade ou</text><text x="508" y="748" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#44506b" text-anchor="start">da referência da ANP e quando foi</text><text x="508" y="768" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#44506b" text-anchor="start">registrado.</text><rect x="816" y="664" width="304" height="130" rx="12" fill="none" stroke="#7b87a3" stroke-width="1"/><text x="836" y="700" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="700" fill="#0042c5" text-anchor="start">3  Contribua</text><text x="836" y="728" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#44506b" text-anchor="start">Quando o app estiver disponível,</text><text x="836" y="748" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#44506b" text-anchor="start">será possível enviar a foto de um</text><text x="836" y="768" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#44506b" text-anchor="start">preço (planejado).</text><text x="160" y="850" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700" fill="#0b1849" text-anchor="start">Para quem é</text><text x="160" y="894" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="700" fill="#0b1849" text-anchor="start">Motorista particular</text><text x="160" y="920" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#44506b" text-anchor="start">Quem abastece com frequência e quer</text><text x="160" y="940" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#44506b" text-anchor="start">comparar informações com fonte e data.</text><text x="488" y="894" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="700" fill="#0b1849" text-anchor="start">Motorista de aplicativo</text><text x="488" y="920" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#44506b" text-anchor="start">Quem roda muito e precisa estimar o</text><text x="488" y="940" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#44506b" text-anchor="start">custo de encher o tanque.</text><text x="816" y="894" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="700" fill="#0b1849" text-anchor="start">Pequeno frotista</text><text x="816" y="920" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#44506b" text-anchor="start">Quem cuida de poucos veículos e quer</text><text x="816" y="940" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#44506b" text-anchor="start">organizar o custo de abastecer.</text><text x="160" y="970" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="400" fill="#7b87a3" text-anchor="start">seção opcional: só com texto verificado</text><rect x="0" y="980" width="1280" height="330" rx="0" fill="#f5f8fc"/><text x="160" y="1036" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700" fill="#0b1849" text-anchor="start">O projeto</text><text x="160" y="1072" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" fill="#44506b" text-anchor="start">Código aberto, com fonte e data à vista. Participar</text><text x="160" y="1096" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" fill="#44506b" text-anchor="start">da comunidade será gratuito; pagamento nunca aumenta</text><text x="160" y="1120" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" fill="#44506b" text-anchor="start">a confiança de um preço (planejado).</text><text x="160" y="1170" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#0042c5" text-anchor="start" text-decoration="underline">Ver código no GitHub</text><rect x="680" y="1020" width="440" height="250" rx="12" fill="#ffffff" stroke="#7b87a3" stroke-width="1"/><text x="704" y="1058" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#0b1849" text-anchor="start">Privacidade em resumo</text><text x="704" y="1090" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#44506b" text-anchor="start">• Consultar preços não exige conta nem localização.</text><text x="704" y="1122" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#44506b" text-anchor="start">• Este site não usa cookies nem rastreadores.</text><text x="704" y="1154" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#44506b" text-anchor="start">• Fotos de comprovação serão privadas, apagadas em até</text><text x="704" y="1174" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#44506b" text-anchor="start">24 h (política do projeto).</text><text x="704" y="1206" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#44506b" text-anchor="start">• Código aberto sob licença MIT.</text><text x="160" y="1366" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700" fill="#0b1849" text-anchor="start">Aplicativo</text><rect x="160" y="1388" width="440" height="168" rx="12" fill="none" stroke="#7b87a3" stroke-width="1"/><text x="180" y="1422" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="700" fill="#0b1849" text-anchor="start">Android · Em breve na Google Play</text><text x="180" y="1450" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#44506b" text-anchor="start">Acompanhe o projeto pelo GitHub; este site não</text><text x="180" y="1470" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#44506b" text-anchor="start">pede cadastro nem e-mail. Ainda não há versões</text><text x="180" y="1490" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#44506b" text-anchor="start">publicadas.</text><text x="180" y="1534" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#0042c5" text-anchor="start" text-decoration="underline">Repositório no GitHub</text><text x="640" y="1366" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" fill="#0b1849" text-anchor="start">Perguntas frequentes</text><rect x="640" y="1388" width="480" height="44" rx="8" fill="none" stroke="#7b87a3" stroke-width="1"/><text x="656" y="1416" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#0b1849" text-anchor="start">Como saber o preço de combustível de um posto?</text><text x="1104" y="1416" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#0042c5" text-anchor="end">+</text><rect x="640" y="1440" width="480" height="44" rx="8" fill="none" stroke="#7b87a3" stroke-width="1"/><text x="656" y="1468" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#0b1849" text-anchor="start">O que é a pesquisa de preços da ANP?</text><text x="1104" y="1468" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#0042c5" text-anchor="end">+</text><rect x="640" y="1492" width="480" height="44" rx="8" fill="none" stroke="#7b87a3" stroke-width="1"/><text x="656" y="1520" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#0b1849" text-anchor="start">Qual a diferença entre preço da comunidade e da ANP?</text><text x="1104" y="1520" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#0042c5" text-anchor="end">+</text><rect x="640" y="1544" width="480" height="44" rx="8" fill="none" stroke="#7b87a3" stroke-width="1"/><text x="656" y="1572" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#0b1849" text-anchor="start">O aplicativo será gratuito?</text><text x="1104" y="1572" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#0042c5" text-anchor="end">+</text><text x="640" y="1610" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="400" fill="#7b87a3" text-anchor="start">&lt;details&gt; nativo</text><rect x="0" y="1636" width="1280" height="160" rx="0" fill="#eef2f9"/><rect x="160" y="1664" width="28" height="28" rx="6" fill="none" stroke="#7b87a3" stroke-width="1" stroke-dasharray="5 4"/><text x="174.0" y="1683.04" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#0042c5" text-anchor="middle">A</text><text x="198" y="1684" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#0b1849" text-anchor="start">abastevo</text><text x="160" y="1720" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#0042c5" text-anchor="start" text-decoration="underline">GitHub · Privacidade · Excluir conta · Termos · Contato</text><text x="160" y="1748" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#44506b" text-anchor="start">Código aberto sob licença MIT. Não afiliado à ANP. Dados de preços da ANP: gov.br/anp. Marcas e nomes citados pertencem</text><text x="160" y="1766" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#44506b" text-anchor="start">a seus titulares.</text></svg>
