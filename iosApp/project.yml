name: AnpFuel
options:
  bundleIdPrefix: com.anpfuel
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    MARKETING_VERSION: "3.1.18"
    CURRENT_PROJECT_VERSION: "30118"
targets:
  AnpFuelCore:
    type: framework
    platform: iOS
    sources:
      - path: Sources/AnpFuelCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anpfuel.core
        DEFINES_MODULE: YES
  AnpFuel:
    type: application
    platform: iOS
    sources:
      - path: Sources/AnpFuelShell
      - path: Assets.xcassets
      - path: App/PrivacyInfo.xcprivacy
    dependencies:
      - target: AnpFuelCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anpfuel.app
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/AnpFuel.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
  AnpFuelCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/AnpFuelCoreTests
    dependencies:
      - target: AnpFuelCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anpfuel.core.tests
schemes:
  AnpFuel:
    build:
      targets:
        AnpFuel: all
        AnpFuelCore: all
        AnpFuelCoreTests: [test]
    test:
      targets:
        - AnpFuelCoreTests
