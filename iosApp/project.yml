name: AnpFuel
options:
  bundleIdPrefix: com.anpfuel
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    MARKETING_VERSION: "3.1.18"
    CURRENT_PROJECT_VERSION: "30118"
targets:
  AnpFuelCore:
    type: framework
    platform: iOS
    sources:
      - path: Sources/AnpFuelCore
        excludes:
          - Resources/Localizable.xcstrings
      - path: Sources/AnpFuelCore/Resources/Localizable.xcstrings
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anpfuel.core
        DEFINES_MODULE: YES
  AnpFuel:
    type: application
    platform: iOS
    sources:
      - path: Sources/AnpFuelShell
        excludes:
          - Localizable.xcstrings
      - path: Sources/AnpFuelShell/Localizable.xcstrings
        buildPhase: resources
      - path: Assets.xcassets
      - path: App/PrivacyInfo.xcprivacy
      - path: App/InfoPlist.xcstrings
        buildPhase: resources
      - path: ../data/src/main/assets/ibge_municipalities.json
        buildPhase: resources
    dependencies:
      - target: AnpFuelCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anpfuel.app
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/AnpFuel.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
  AnpFuelCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/AnpFuelCoreTests
      - path: ../contracts/testdata/premium/energy-v1.json
        buildPhase: resources
      - path: ../contracts/testdata/api/feedback-comment-view-valid.json
        buildPhase: resources
      - path: ../contracts/testdata/api/feedback-rating-receipt-valid.json
        buildPhase: resources
      - path: ../contracts/testdata/api/feedback-rating-stats-valid.json
        buildPhase: resources
      - path: ../contracts/testdata/api/forum-comments-response-valid.json
        buildPhase: resources
      - path: ../contracts/testdata/api/forum-create-comment-valid.json
        buildPhase: resources
      - path: ../contracts/testdata/api/forum-edit-comment-invalid.json
        buildPhase: resources
      - path: ../contracts/testdata/api/forum-edit-comment-valid.json
        buildPhase: resources
      - path: ../contracts/testdata/api/forum-feed-response-valid.json
        buildPhase: resources
      - path: ../contracts/testdata/api/forum-owner-topic-response-valid.json
