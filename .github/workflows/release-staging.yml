# Builds signed, digest-pinned staging release artifacts from a green main
# commit. This public workflow uses only the automatic GITHUB_TOKEN and GitHub
# OIDC; it never receives a host, SSH key or runtime secret.
#
# Automatic runs require the quick, CI and backend workflow runs for the same
# main head_sha to have concluded successfully. Path-filtered workflows that
# did not run for a commit leave the release gate closed instead of failing.
name: release-staging
run-name: release-staging ${{ github.event.workflow_run.head_sha || inputs.sha }}

on:
  workflow_run:
    workflows: [quick, CI, backend]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: Full 40-hex commit SHA reachable from main
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-staging
  cancel-in-progress: false

jobs:
  gate:
    name: release gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      packages: read
    outputs:
      ready: ${{ steps.gate.outputs.ready }}
      sha: ${{ steps.target.outputs.sha }}
      workflow_run_url: ${{ steps.target.outputs.workflow_run_url }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0
      - name: Resolve target commit
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_SHA: ${{ inputs.sha }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          TRIGGER_NAME: ${{ github.event.workflow_run.name }}
          TRIGGER_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          TRIGGER_URL: ${{ github.event.workflow_run.html_url }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
              printf '%s\n' "manual dispatch is restricted to main" >&2
              exit 1
            fi
            sha="$INPUT_SHA"
            workflow_run_url="https://github.com/${REPOSITORY}/actions/runs/${RUN_ID}"
          else
            if [[ "$HEAD_BRANCH" != "main" ]]; then
              printf '%s\n' "workflow_run is not for main" >&2
              exit 1
            fi
            case "$TRIGGER_NAME" in
              quick|CI|backend) ;;
              *)
                printf '%s\n' "unexpected triggering workflow" >&2
                exit 1
                ;;
            esac
            if [[ "$TRIGGER_CONCLUSION" != "success" ]]; then
              printf '%s\n' "triggering workflow did not succeed" >&2
              exit 1
            fi
            sha="$HEAD_SHA"
            workflow_run_url="$TRIGGER_URL"
          fi
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            printf '%s\n' "target SHA must be a full 40-hex commit id" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$sha" HEAD; then
            printf '%s\n' "target SHA is not reachable from main" >&2
            exit 1
          fi
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"
          printf 'workflow_run_url=%s\n' "$workflow_run_url" >> "$GITHUB_OUTPUT"
      - uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4 # v2.0.2
        with:
          version: 1.3.4
      - name: Evaluate release gate
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ steps.target.outputs.sha }}
          OWNER: ${{ github.repository_owner }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            printf 'ready=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ready=true
          for path in \
            .github/workflows/quick.yml \
            .github/workflows/ci.yml \
            .github/workflows/backend.yml; do
            conclusion="$(gh api "repos/${REPOSITORY}/actions/runs?head_sha=${SHA}&per_page=100" \
              | jq -r --arg path "$path" '[.workflow_runs[] | select(.path == $path and .event == "push" and .head_branch == "main")] | sort_by(.created_at) | last | .conclusion // "missing"')"
            if [[ "$conclusion" == "missing" ]]; then
              ready=false
            elif [[ "$conclusion" != "success" ]]; then
              printf 'required workflow did not succeed: %s\n' "$path" >&2
              exit 1
            fi
          done
          if [[ "$ready" == "true" ]]; then
            owner_lc="$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')"
            repository="ghcr.io/${owner_lc}/abastevo-release"
            printf '%s' "$GH_TOKEN" | oras login ghcr.io --username "$ACTOR" --password-stdin
            if oras manifest fetch "${repository}:sha-${SHA}" >/dev/null 2>&1; then
              ready=false
              printf '%s\n' "a published release already exists for this commit; no duplicate release" >&2
            fi
          fi
          printf 'ready=%s\n' "$ready" >> "$GITHUB_OUTPUT"
          if [[ "$ready" != "true" ]]; then
            printf '%s\n' "release gate is closed for this commit" >&2
          fi

  landing:
    name: landing bundle
    needs: gate
    if: needs.gate.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.gate.outputs.sha }}
      - name: Verify Node runtime
        run: |
          set -euo pipefail
          node --version
          node -e 'if (Number(process.versions.node.split(".")[0]) < 20) process.exit(1)'
      - name: Build landing for the staging origin
        run: |
          set -euo pipefail
          npm --prefix landing ci
          npm --prefix landing run build -- --origin https://teste.abastevo.com.br
          npm --prefix landing run check
          npm --prefix landing test
      - name: Build admin web panel into the landing bundle
        run: |
          set -euo pipefail
          npm --prefix admin-web ci
          npm --prefix admin-web run typecheck
          npm --prefix admin-web run build
          npm --prefix admin-web run check
          npm --prefix admin-web test
          test ! -e landing/dist/admin
          mkdir landing/dist/admin
          cp -R admin-web/dist/. landing/dist/admin/
          test -f landing/dist/admin/login/index.html
      - name: Package landing bundle
        id: package
        run: |
          set -euo pipefail
          tar -czf landing-dist.tar.gz -C landing/dist .
          sha256="$(sha256sum landing-dist.tar.gz | cut -d' ' -f1)"
          printf '%s\n' "$sha256" > landing-dist.sha256
          printf 'sha256=%s\n' "$sha256" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: landing-dist
          path: |
            landing-dist.tar.gz
            landing-dist.sha256
          if-no-files-found: error
          retention-days: 30

  images:
    name: image ${{ matrix.role }}
    needs: gate
    if: needs.gate.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: true
      matrix:
        role: [api, worker, migrate]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.gate.outputs.sha }}
      - name: Resolve image coordinate
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
          ROLE: ${{ matrix.role }}
        run: |
          set -euo pipefail
          owner_lc="$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')"
          printf 'repository=ghcr.io/%s/abastevo-%s\n' "$owner_lc" "$ROLE" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push immutable image
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: infra/docker/Dockerfile
          target: ${{ matrix.role }}
          build-args: |
            REVISION=${{ needs.gate.outputs.sha }}
          tags: ${{ steps.image.outputs.repository }}:sha-${{ needs.gate.outputs.sha }}
          push: true
          provenance: false
          sbom: false
      - name: Install syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.55.0
      - name: Generate SPDX SBOM
        env:
          IMAGE: ${{ steps.image.outputs.repository }}
          DIGEST: ${{ steps.build.outputs.digest }}
          ROLE: ${{ matrix.role }}
        run: |
          set -euo pipefail
          mkdir -p sbom
          syft "${IMAGE}@${DIGEST}" -o "spdx-json=sbom/${ROLE}.spdx.json"
      - name: Attest image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Record image digest
        env:
          IMAGE: ${{ steps.image.outputs.repository }}
          DIGEST: ${{ steps.build.outputs.digest }}
          ROLE: ${{ matrix.role }}
        run: |
          set -euo pipefail
          mkdir -p image-meta
          jq -n --arg role "$ROLE" --arg image "$IMAGE" --arg digest "$DIGEST" \
            '{role: $role, image: $image, digest: $digest, ref: ($image + "@" + $digest)}' \
            > "image-meta/image-${ROLE}.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image-meta-${{ matrix.role }}
          path: image-meta/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-${{ matrix.role }}
          path: sbom/
          if-no-files-found: error
          retention-days: 30

  manifest:
    name: signed release manifest
    needs: [gate, images, landing]
    if: needs.gate.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.gate.outputs.sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: image-meta-*
          path: images
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: landing-dist
          path: landing-bundle
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4
      - name: Install oras
        uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4 # v2.0.2
        with:
          version: 1.3.4
      - name: Assemble release manifest
        env:
          SHA: ${{ needs.gate.outputs.sha }}
          WORKFLOW_RUN_URL: ${{ needs.gate.outputs.workflow_run_url }}
        run: |
          set -euo pipefail
          created_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          landing_sha256="$(sha256sum landing-bundle/landing-dist.tar.gz | cut -d' ' -f1)"
          migrations_max="$(find backend/db/migrations -maxdepth 1 -name '[0-9][0-9][0-9][0-9][0-9][0-9]_*.sql' -printf '%f\n' | sort | tail -n 1 | cut -c1-6)"
          if [[ -z "$migrations_max" ]]; then
            printf '%s\n' "no migrations found" >&2
            exit 1
          fi
          schema_min_supported="$(tr -d '[:space:]' < backend/db/migrations/schema_min_supported)"
          if [[ ! "$schema_min_supported" =~ ^[0-9]{6}$ ]]; then
            printf '%s\n' "invalid schema_min_supported declaration" >&2
            exit 1
          fi
          if [[ "$schema_min_supported" > "$migrations_max" ]]; then
            printf '%s\n' "schema_min_supported is newer than the migration chain" >&2
            exit 1
          fi
          test -s images/image-api.json
          test -s images/image-worker.json
          test -s images/image-migrate.json
          jq -n \
            --arg schema "abastevo-release-manifest-v1" \
            --arg sha "$SHA" \
            --arg created_at "$created_at" \
            --arg landing_sha256 "$landing_sha256" \
            --arg migrations_max "$migrations_max" \
            --arg schema_min_supported "$schema_min_supported" \
            --arg workflow_run_url "$WORKFLOW_RUN_URL" \
            --slurpfile api images/image-api.json \
            --slurpfile worker images/image-worker.json \
            --slurpfile migrate images/image-migrate.json \
            '{schema: $schema, sha: $sha, created_at: $created_at, images: {api: $api[0].ref, worker: $worker[0].ref, migrate: $migrate[0].ref}, landing_sha256: $landing_sha256, migrations_max: $migrations_max, schema_min_supported: $schema_min_supported, workflow_run_url: $workflow_run_url}' \
            > release-manifest.json
          jq -e '.schema == "abastevo-release-manifest-v1" and (.sha | test("^[0-9a-f]{40}$")) and ((.images | keys) == ["api", "migrate", "worker"]) and ([.images[] | test("@sha256:[0-9a-f]{64}$")] | all) and (.landing_sha256 | test("^[0-9a-f]{64}$")) and (.migrations_max | test("^[0-9]{6}$")) and (.schema_min_supported | test("^[0-9]{6}$")) and (.schema_min_supported <= .migrations_max)' release-manifest.json > /dev/null
      - name: Sign release manifest keyless
        run: |
          set -euo pipefail
          cosign sign-blob --yes --bundle release-manifest.sigstore.json release-manifest.json
      - name: Attest manifest provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-manifest.json
      - name: Publish OCI release artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
          SHA: ${{ needs.gate.outputs.sha }}
        run: |
          set -euo pipefail
          owner_lc="$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')"
          repository="ghcr.io/${owner_lc}/abastevo-release"
          landing_sha256="$(jq -r '.landing_sha256' release-manifest.json)"
          landing_digest="sha256:$(sha256sum landing-bundle/landing-dist.tar.gz | cut -d' ' -f1)"
          if [[ "$landing_digest" != "sha256:${landing_sha256}" ]]; then
            printf '%s\n' "landing archive does not match the signed manifest" >&2
            exit 1
          fi
          printf '%s' "$GH_TOKEN" | oras login ghcr.io --username "$ACTOR" --password-stdin
          oras push "${repository}:sha-${SHA}" \
            --artifact-type application/vnd.abastevo.release.v1+json \
            "release-manifest.json:application/vnd.abastevo.release.manifest.v1+json" \
            "release-manifest.sigstore.json:application/vnd.dev.sigstore.bundle.v0.3+json" \
            "landing-bundle/landing-dist.tar.gz:application/vnd.abastevo.landing.tar+gzip"
          oras manifest fetch "${repository}:sha-${SHA}" \
            | jq -e --arg digest "$landing_digest" '[.layers[] | select(.mediaType == "application/vnd.abastevo.landing.tar+gzip")] | length == 1 and .[0].digest == $digest' >/dev/null
          oras tag "${repository}:sha-${SHA}" staging
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-manifest
          path: |
            release-manifest.json
            release-manifest.sigstore.json
            landing-bundle/landing-dist.tar.gz
            landing-bundle/landing-dist.sha256
          if-no-files-found: error
          retention-days: 90
      - name: Print manifest verification command
        run: |
          cat <<'EOF'
          cosign verify-blob \
            --bundle release-manifest.sigstore.json \
            --certificate-identity "https://github.com/AlexandreZanata/Abastevo/.github/workflows/release-staging.yml@refs/heads/main" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            release-manifest.json
          EOF
