# Backend fast and integration gates. No secrets are used, so fork PRs run
# the same checks. Integration fails (never skips) when PostGIS is down.
name: backend

on:
  push:
    branches: [main]
    paths:
      - backend/**
      - tools/station-prep/**
      - contracts/**
      - infra/**
      - scripts/check-backend-fast.sh
      - scripts/scan-secrets.sh
      - scripts/audit-anp-source-census.py
      - scripts/audit-enforcement-privacy.py
      - scripts/tests/test-anp-source-census.py
      - scripts/tests/test-enforcement-privacy.py
      - .github/workflows/backend.yml
      - .github/workflows/release-staging.yml
      - scripts/check-release-workflow.sh
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - backend/**
      - tools/station-prep/**
      - contracts/**
      - infra/**
      - scripts/check-backend-fast.sh
      - scripts/scan-secrets.sh
      - scripts/audit-anp-source-census.py
      - scripts/audit-enforcement-privacy.py
      - scripts/tests/test-anp-source-census.py
      - scripts/tests/test-enforcement-privacy.py
      - .github/workflows/backend.yml
      - .github/workflows/release-staging.yml
      - scripts/check-release-workflow.sh

env:
  # Pinned exact (matches backend/go.mod toolchain). Do not float back to
  # go-version-file: setup-go resolves the `go` directive to the latest
  # 1.27.x patch, and the pinned staticcheck cannot read a newer compiler's
  # export data yet (fast/quick outage on 1.27.2, 2026-10-09). The fast gate
  # runs staticcheck under GOTOOLCHAIN=go1.27.1 until it catches up.
  # Re-pin deliberately only after verifying staticcheck AND govulncheck
  # against the new toolchain.
  GO_VERSION: '1.27.3'
  RUST_VERSION: '1.99.0'
  SQLC_VERSION: v1.31.1
  STATICCHECK_VERSION: v0.8.1
  VACUUM_VERSION: v0.30.6
  GOVULNCHECK_VERSION: v1.8.0

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum
      - name: Install pinned tools
        run: |
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@${{ env.SQLC_VERSION }}
          GOTOOLCHAIN=go1.27.1 go install honnef.co/go/tools/cmd/staticcheck@${{ env.STATICCHECK_VERSION }}
          go install github.com/daveshanley/vacuum@${{ env.VACUUM_VERSION }}
          GOTOOLCHAIN=go1.27.1 go install golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }}
      - name: Synthetic source census and privacy regressions
        run: |
          python3 scripts/tests/test-anp-source-census.py
          python3 scripts/tests/test-enforcement-privacy.py
      - name: Fast gate (no database)
        run: bash scripts/check-backend-fast.sh
      - name: Vulnerability scan
        run: cd backend && govulncheck ./...

  integration:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:18-3.6@sha256:60f6ad1d21ea86a67d47780b9a0d1e1d200500f62b19293fa834d0dea80b8677
        env:
          POSTGRES_USER: anpfuel
          POSTGRES_PASSWORD: anpfuel
          POSTGRES_DB: anpfuel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U anpfuel -d anpfuel"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Runner steps reach services via localhost:mapped-port; the `postgres`
      # hostname resolves only between service containers.
      ANPFUEL_TEST_DATABASE_URL: postgres://anpfuel:anpfuel@127.0.0.1:5432/anpfuel?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum
      - name: Build locked Rust source preparers
        run: |
          rustup toolchain install ${{ env.RUST_VERSION }} --profile minimal
          cargo +${{ env.RUST_VERSION }} build --locked --manifest-path tools/station-prep/Cargo.toml --bin prepare_registry --bin prepare_quality --bin prepare_sanctions --bin prepare_fine_history --bin prepare_enforcement --bin prepare_charging --bin prepare_vehicle --target-dir "$RUNNER_TEMP/station-prep-target"
          echo "ANPFUEL_TEST_PREPARER_PATH=$RUNNER_TEMP/station-prep-target/debug/prepare_registry" >> "$GITHUB_ENV"
          chmod 755 "$RUNNER_TEMP/station-prep-target/debug/prepare_quality"
          echo "ANPFUEL_TEST_QUALITY_PREPARER_PATH=$RUNNER_TEMP/station-prep-target/debug/prepare_quality" >> "$GITHUB_ENV"
          chmod 755 "$RUNNER_TEMP/station-prep-target/debug/prepare_sanctions"
          echo "ANPFUEL_TEST_SANCTIONS_PREPARER_PATH=$RUNNER_TEMP/station-prep-target/debug/prepare_sanctions" >> "$GITHUB_ENV"
          chmod 755 "$RUNNER_TEMP/station-prep-target/debug/prepare_fine_history"
          echo "ANPFUEL_TEST_FINE_HISTORY_PREPARER_PATH=$RUNNER_TEMP/station-prep-target/debug/prepare_fine_history" >> "$GITHUB_ENV"
          chmod 755 "$RUNNER_TEMP/station-prep-target/debug/prepare_enforcement"
          echo "ANPFUEL_TEST_ENFORCEMENT_PREPARER_PATH=$RUNNER_TEMP/station-prep-target/debug/prepare_enforcement" >> "$GITHUB_ENV"
          chmod 755 "$RUNNER_TEMP/station-prep-target/debug/prepare_charging"
          echo "ANPFUEL_TEST_CHARGING_PREPARER_PATH=$RUNNER_TEMP/station-prep-target/debug/prepare_charging" >> "$GITHUB_ENV"
          chmod 755 "$RUNNER_TEMP/station-prep-target/debug/prepare_vehicle"
          echo "ANPFUEL_TEST_VEHICLE_PREPARER_PATH=$RUNNER_TEMP/station-prep-target/debug/prepare_vehicle" >> "$GITHUB_ENV"
      - name: Enable PostGIS via the migrator
        run: cd backend && ANPFUEL_DATABASE_URL=${{ env.ANPFUEL_TEST_DATABASE_URL }} go run ./cmd/migrate
      - name: Integration tests (real PostGIS, race detector)
        run: cd backend && go test -race -count=1 -tags=integration ./...
