# Backend fast and integration gates. No secrets are used, so fork PRs run
# the same checks. Integration fails (never skips) when PostGIS is down.
name: backend

on:
  push:
    branches: [main]
    # No path filter on main: the release-staging gate needs this workflow's
    # result for every main commit, or path-only merges never release.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - backend/**
      # iOS parity exercises backend contracts, so the PR needs backend checks.
      - iosApp/**
      - tools/station-prep/**
      - contracts/**
      - infra/**
      - scripts/check-backend-fast.sh
      - scripts/scan-secrets.sh
      - scripts/audit-anp-source-census.py
      - scripts/audit-enforcement-privacy.py
      - scripts/tests/test-anp-source-census.py
      - scripts/tests/test-enforcement-privacy.py
      - .github/workflows/backend.yml
      - .github/workflows/release-staging.yml
      - scripts/check-release-workflow.sh

env:
  # Pinned exact (matches backend/go.mod toolchain). Do not float back to
  # go-version-file: setup-go resolves the `go` directive to the latest
  # 1.27.x patch, and the pinned staticcheck cannot read a newer compiler's
  # export data yet (fast/quick outage on 1.27.2, 2026-10-09). The fast gate
  # runs staticcheck under GOTOOLCHAIN=go1.27.1 until it catches up.
  # Re-pin deliberately only after verifying staticcheck AND govulncheck
  # against the new toolchain.
  GO_VERSION: '1.27.4'
  RUST_VERSION: '1.99.0'
  SQLC_VERSION: v1.31.1
  STATICCHECK_VERSION: v0.8.1
  VACUUM_VERSION: v0.30.6
  GOVULNCHECK_VERSION: v1.8.0

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum
      - name: Install pinned tools
        run: |
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@${{ env.SQLC_VERSION }}
          GOTOOLCHAIN=go1.27.1 go install honnef.co/go/tools/cmd/staticcheck@${{ env.STATICCHECK_VERSION }}
          go install github.com/daveshanley/vacuum@${{ env.VACUUM_VERSION }}
          GOTOOLCHAIN=go1.27.1 go install golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }}
      - name: Synthetic source census and privacy regressions
        run: |
          python3 scripts/tests/test-anp-source-census.py
          python3 scripts/tests/test-enforcement-privacy.py
      - name: Integration legs cover every test exactly once
        run: python3 scripts/tests/test-backend-integration-shard.py
      - name: Fast gate (no database)
        run: bash scripts/check-backend-fast.sh
      - name: Vulnerability scan
        run: cd backend && govulncheck ./...

  integration:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: integration (${{ matrix.leg }})
    runs-on: ubuntu-latest
    # One `go test ./...` took 44-57 min because Go runs the top-level tests of
    # a package one after another: organization/adapters (~33 min) and
    # platform/apicontract (~21 min) were the critical path. Legs run on
    # separate runners with their own PostGIS and MinIO; the two largest
    # packages are split by a stable hash of the test name and every other
    # package runs unsharded in the rest leg. The union of the legs is exactly
    # the former command: nothing is skipped or shortened, and
    # scripts/tests/test-backend-integration-shard.py pins this matrix to
    # scripts/backend-integration-shard.py.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { leg: "organization adapters 1/4", package: "./internal/modules/organization/adapters", shard: 0, shards: 4 }
          - { leg: "organization adapters 2/4", package: "./internal/modules/organization/adapters", shard: 1, shards: 4 }
          - { leg: "organization adapters 3/4", package: "./internal/modules/organization/adapters", shard: 2, shards: 4 }
          - { leg: "organization adapters 4/4", package: "./internal/modules/organization/adapters", shard: 3, shards: 4 }
          - { leg: "api contract 1/2", package: "./internal/platform/apicontract", shard: 0, shards: 2 }
          - { leg: "api contract 2/2", package: "./internal/platform/apicontract", shard: 1, shards: 2 }
          - { leg: "other packages", package: "", shard: 0, shards: 1 }
    services:
      postgres:
        image: postgis/postgis:18-3.6@sha256:60f6ad1d21ea86a67d47780b9a0d1e1d200500f62b19293fa834d0dea80b8677
        env:
          POSTGRES_USER: anpfuel
          POSTGRES_PASSWORD: anpfuel
          POSTGRES_DB: anpfuel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U anpfuel -d anpfuel"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      # Disposable private S3 for real-storage suites (orgmedia originals and the
      # API's evidence path); same reviewed image as compose.validation.yml.
      storage:
        image: bitnamilegacy/minio@sha256:451fe6858cb770cc9d0e77ba811ce287420f781c7c1b806a386f6896471a349c
        env:
          MINIO_ROOT_USER: localvalidation
          MINIO_ROOT_PASSWORD: local-validation-only-20260930
          MINIO_DEFAULT_BUCKETS: validation-private
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -fsS http://127.0.0.1:9000/minio/health/live"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      # Runner steps reach services via localhost:mapped-port; the `postgres`
      # hostname resolves only between service containers.
      ANPFUEL_TEST_DATABASE_URL: postgres://anpfuel:anpfuel@127.0.0.1:5432/anpfuel?sslmode=disable
      ANPFUEL_TEST_STORAGE_ENDPOINT: http://127.0.0.1:9000
      ANPFUEL_TEST_STORAGE_BUCKET: validation-private
      ANPFUEL_TEST_STORAGE_REGION: us-east-1
      ANPFUEL_TEST_STORAGE_ACCESS_KEY_ID: localvalidation
      ANPFUEL_TEST_STORAGE_SECRET_ACCESS_KEY: local-validation-only-20260930
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum
      - name: Build locked Rust source preparers
        # Only cmd/worker, directory and quality suites run the preparers; they
        # are all in the rest leg.
        if: matrix.package == ''
        run: |
          rustup toolchain install ${{ env.RUST_VERSION }} --profile minimal
          cargo +${{ env.RUST_VERSION }} build --locked --manifest-path tools/station-prep/Cargo.toml --bin prepare_registry --bin prepare_quality --bin prepare_sanctions --bin prepare_fine_history --bin prepare_enforcement --bin prepare_charging --bin prepare_vehicle --target-dir "$RUNNER_TEMP/station-prep-target"
          echo "ANPFUEL_TEST_PREPARER_PATH=$RUNNER_TEMP/station-prep-target/debug/prepare_registry" >> "$GITHUB_ENV"
          chmod 755 "$RUNNER_TEMP/station-prep-target/debug/prepare_quality"
          echo "ANPFUEL_TEST_QUALITY_PREPARER_PATH=$RUNNER_TEMP/station-prep-target/debug/prepare_quality" >> "$GITHUB_ENV"
          chmod 755 "$RUNNER_TEMP/station-prep-target/debug/prepare_sanctions"
          echo "ANPFUEL_TEST_SANCTIONS_PREPARER_PATH=$RUNNER_TEMP/station-prep-target/debug/prepare_sanctions" >> "$GITHUB_ENV"
          chmod 755 "$RUNNER_TEMP/station-prep-target/debug/prepare_fine_history"
          echo "ANPFUEL_TEST_FINE_HISTORY_PREPARER_PATH=$RUNNER_TEMP/station-prep-target/debug/prepare_fine_history" >> "$GITHUB_ENV"
          chmod 755 "$RUNNER_TEMP/station-prep-target/debug/prepare_enforcement"
          echo "ANPFUEL_TEST_ENFORCEMENT_PREPARER_PATH=$RUNNER_TEMP/station-prep-target/debug/prepare_enforcement" >> "$GITHUB_ENV"
          chmod 755 "$RUNNER_TEMP/station-prep-target/debug/prepare_charging"
          echo "ANPFUEL_TEST_CHARGING_PREPARER_PATH=$RUNNER_TEMP/station-prep-target/debug/prepare_charging" >> "$GITHUB_ENV"
          chmod 755 "$RUNNER_TEMP/station-prep-target/debug/prepare_vehicle"
          echo "ANPFUEL_TEST_VEHICLE_PREPARER_PATH=$RUNNER_TEMP/station-prep-target/debug/prepare_vehicle" >> "$GITHUB_ENV"
      - name: Enable PostGIS via the migrator
        run: cd backend && ANPFUEL_DATABASE_URL=${{ env.ANPFUEL_TEST_DATABASE_URL }} go run ./cmd/migrate
      - name: Integration tests (real PostGIS, race detector)
        # The full organization and contract packages exceed Go's implicit 10m
        # package deadline under the race detector on the shared runner. Keep
        # every case with an explicit bounded limit. organization/adapters took
        # 1121.7s (main 43b21389) after the F2 OFFL-008 review suites and timed
        # out at 20m on PR #219 runner variance, so the bound was raised to 30m.
        # The F3 batch adds period, document, export, notification, scope,
        # allocation, assignment and auditor suites to that package: its local
        # race time grew from ~620s to ~800-900s alone (1221s under load), which
        # projects to ~27m on the shared runner, so the bound is 45m (EDR-168).
        # The script keeps that bound per leg. No case is skipped or shortened.
        run: |
          if [ -z "${{ matrix.package }}" ]; then
            python3 scripts/backend-integration-shard.py --rest
          else
            python3 scripts/backend-integration-shard.py --package "${{ matrix.package }}" --shard ${{ matrix.shard }} --shards ${{ matrix.shards }}
          fi
