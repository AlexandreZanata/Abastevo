name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - docs/**
      - contracts/**
      - infra/**
      - backend/**
      - '*.md'
      - .github/workflows/backend.yml
  pull_request:
    branches: [main]
    paths-ignore:
      - docs/**
      - contracts/**
      - infra/**
      - backend/**
      - '*.md'
      - .github/workflows/backend.yml

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Run unit tests
        run: ./gradlew test --no-daemon
