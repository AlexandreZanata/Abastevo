# anpfuel community platform API, version 1.
#
# Status: DRAFT and unpublished. Future endpoints are added here before any
# handler implements them; a published contract is never overwritten, only
# superseded. Vocabulary follows docs/backend/DOMAIN_MODEL.md (B-BR-002,
# FuelPrice/FuelProduct/PriceCondition) and docs/backend/API_PLAN.md wire
# syntax. No silent enum rename or unit/amount reinterpretation in v1.
openapi: 3.1.0
info:
  title: anpfuel community platform
  version: 1.0.0-draft
  description: >
    Base schemas, error envelope, health skeleton and auth profile reference.
    Domain endpoints (directory, official, identity, community) land in later
    tasks, each with contract-first paths added here before code. Writes
    authenticate by anonymous proof of possession (P-256, RFC 9421 profile);
    the exact covered components, encoding and challenge binding freeze in
    P03-T01 (identity profile) and no securityScheme is published before then.
  contact:
    name: anpfuel maintainers
  license:
    name: MIT
    url: https://opensource.org/license/mit
tags:
  - name: health
    description: Process liveness and dependency readiness probes.
  - name: directory
    description: Anonymous public station catalog reads.
  - name: official
    description: Anonymous revision-aware official price reads.
  - name: community
    description: Signed observation submit and owner reads.
  - name: evidence
    description: Signed private upload reservation and owner status.
  - name: identity
    description: Anonymous challenge and contributor registration.
paths:
  /health/live:
    get:
      summary: Process liveness (no dependency checks).
      operationId: healthLive
      tags: [health]
      security: []
      responses:
        '200':
          description: Process event loop is running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
              example:
                status: ok
  /health/ready:
    get:
      summary: Dependency readiness (fails closed while DB is down).
      operationId: healthReady
      tags: [health]
      security: []
      responses:
        '200':
          description: Dependencies ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
              example:
                status: ready
        '503':
          description: A dependency is not ready; process stays alive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
              example:
                status: not_ready
  /v1/identity/challenges:
    post:
      summary: Issue a bound challenge (anonymous).
      operationId: issueChallenge
      tags: [identity]
      security: []
      requestBody:
        required: true
        description: Challenge input for this operation.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChallengeRequest'
            example:
              fingerprint: e568c4f52605d14215f6e649000e4ffc2da4caa4bdcbbf2b8bcd9937ff9ea624
              purpose: REGISTER
      responses:
        '201':
          description: Challenge with single-use nonce.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Challenge'
              example:
                challenge_id: d6c74c23-63db-4c24-a2e5-408cb23bad26
                nonce: d6c74c23-63db-4c24-a2e5-408cb23bad26.9f2c4a7e8b1d3f5a
                fingerprint: e568c4f52605d14215f6e649000e4ffc2da4caa4bdcbbf2b8bcd9937ff9ea624
                purpose: REGISTER
                expires_at: '2026-09-28T00:05:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
  /v1/contributors:
    post:
      summary: Register key ownership with proof (anonymous).
      operationId: registerContributor
      tags: [identity]
      security: []
      requestBody:
        required: true
        description: Registration input with key and proof.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContributorRegistration'
            example:
              public_jwk:
                kty: EC
                crv: P-256
                x: 5H8pdbqwCE7YcVh0t7VNWgcQVrZ4S66TjfwBDE8tneE
                y: WpcgI0Z8gndT_z9lTn8qgoevjDFsjVAlRvfpo6-KJIs
              challenge_id: d6c74c23-63db-4c24-a2e5-408cb23bad26
              proof:
                lines:
                  - '"@method": POST'
                  - '"@authority": api.example.invalid'
                  - '"@path": /v1/contributors'
                  - '"@query": '
                  - '"created": 1735689600'
                  - '"expires": 1735689900'
                  - '"keyid": "e568c4f52605d14215f6e649000e4ffc2da4caa4bdcbbf2b8bcd9937ff9ea624"'
                  - '"nonce": "d6c74c23-63db-4c24-a2e5-408cb23bad26.9f2c4a7e8b1d3f5a"'
                signature: MEUCIQ
      responses:
        '201':
          description: Contributor with key ownership; duplicates return existing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contributor'
              example:
                contributor_id: d6c74c23-63db-4c24-a2e5-408cb23bad26
                key_id: aac027be-d331-40e4-8d63-52ec3b8d2f41
                existed: false
        '400':
          $ref: '#/components/responses/BadRequest'
  /v1/contributors/me/keys/rotate:
    post:
      summary: Rotate to a new key with old and new proofs (anonymous).
      operationId: rotateContributorKey
      tags: [identity]
      security: []
      requestBody:
        required: true
        description: Old and new proofs plus the candidate key.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KeyRotation'
            example:
              old:
                challenge_id: d6c74c23-63db-4c24-a2e5-408cb23bad26
                lines: ['"@method": POST']
                signature: MEUCIQ
              new_jwk:
                kty: EC
                crv: P-256
                x: 5H8pdbqwCE7YcVh0t7VNWgcQVrZ4S66TjfwBDE8tneE
                y: WpcgI0Z8gndT_z9lTn8qgoevjDFsjVAlRvfpo6-KJIs
              new:
                challenge_id: aac027be-d331-40e4-8d63-52ec3b8d2f41
                lines: ['"@method": POST']
                signature: MEUCIQ
      responses:
        '200':
          description: Contributor preserved, old key revoked, new key bound.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rotation'
              example:
                contributor_id: d6c74c23-63db-4c24-a2e5-408cb23bad26
                old_key_id: aac027be-d331-40e4-8d63-52ec3b8d2f41
                new_key_id: bbd138ce-e442-4f57-a874-3c05d2e16f52
                existed: false
        '400':
          $ref: '#/components/responses/BadRequest'
  /v1/observations:
    post:
      summary: Submit one observation (signed, idempotent).
      operationId: submitObservation
      tags: [community]
      security: []
      parameters:
        - name: Idempotency-Key
          in: header
          description: Client operation key for safe retries.
          schema: {type: string, minLength: 1, maxLength: 128}
          example: cmd-2026-09-28-001
      requestBody:
        required: true
        description: Submission content; contributor derives from proof.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ObservationSubmit'
            example:
              client_submission_id: sub-2026-09-28-001
              station_id: d6c74c23-63db-4c24-a2e5-408cb23bad26
              fuel_product: GASOLINE_REGULAR
              price: {amount_milli_brl: 5999, currency: BRL, unit: L}
              condition: {kind: STANDARD, qualifier_id: null}
      responses:
        '201':
          description: Received, never a publication claim.
          headers:
            Cache-Control:
              schema: {type: string, example: 'no-store'}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObservationReceipt'
              example:
                id: d6c74c23-63db-4c24-a2e5-408cb23bad27
                validation_state: RECEIVED
                received_at: '2026-09-28T00:00:00Z'
                status_url: /v1/observations/d6c74c23-63db-4c24-a2e5-408cb23bad27
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
  /v1/observations/{observation_id}:
    get:
      summary: Owner observation status (signed).
      operationId: observationStatus
      tags: [community]
      security: []
      parameters:
        - name: observation_id
          in: path
          required: true
          description: Observation identifier.
          schema: {type: string, format: uuid}
          example: d6c74c23-63db-4c24-a2e5-408cb23bad27
      responses:
        '200':
          description: Fact with derived state and decision timeline.
          headers:
            Cache-Control:
              schema: {type: string, example: 'no-store'}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObservationStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/contributors/me/observations:
    get:
      summary: Own observation history (signed).
      operationId: ownObservations
      tags: [community]
      security: []
      parameters:
        - name: limit
          in: query
          description: Page size.
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
          example: 20
        - name: cursor
          in: query
          description: Opaque cursor continuing own history.
          schema: {type: string}
      responses:
        '200':
          description: Newest-first owner history page.
          headers:
            Cache-Control:
              schema: {type: string, example: 'no-store'}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObservationHistory'
              example:
                items: []
                next_cursor: null
                generated_at: '2026-09-28T00:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/uploads:
    post:
      summary: Reserve an owned upload session with a short PUT authorization (signed).
      operationId: reserveUpload
      tags: [evidence]
      security: []
      requestBody:
        required: true
        description: Upload intent; the object key is server-generated, never client-supplied.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadReserveRequest'
            example:
              client_submission_id: upl-2026-09-30-001
              content_type: image/jpeg
              size_bytes: 524288
              sha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      responses:
        '201':
          description: Reserved session with a short direct PUT authorization; the URL enforces transport only, never size.
          headers:
            Cache-Control:
              schema: {type: string, example: 'no-store'}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadReservation'
              example:
                upload_id: e0000000-0000-4000-8000-000000000001
                method: PUT
                url: https://xxx.r2.cloudflarestorage.com/anpfuel-quarantine/q/e0000000000000000000000000000001?X-Amz-Algorithm=AWS4-HMAC-SHA256
                required_headers:
                  content-type: image/jpeg
                expires_at: '2026-09-30T12:05:00Z'
                max_bytes: 3145728
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
  /v1/uploads/{upload_id}:
    get:
      summary: Owner upload status (signed).
      operationId: uploadStatus
      tags: [evidence]
      security: []
      parameters:
        - name: upload_id
          in: path
          required: true
          description: Upload session identifier.
          schema: {type: string, format: uuid}
          example: e0000000-0000-4000-8000-000000000001
      responses:
        '200':
          description: Session state; READY carries the evidence id, never an object URL.
          headers:
            Cache-Control:
              schema: {type: string, example: 'no-store'}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/uploads/{upload_id}/complete:
    post:
      summary: Completion intent moving the session to verification (signed, idempotent).
      operationId: completeUpload
      tags: [evidence]
      security: []
      parameters:
        - name: upload_id
          in: path
          required: true
          description: Upload session identifier.
          schema: {type: string, format: uuid}
          example: e0000000-0000-4000-8000-000000000001
      responses:
        '202':
          description: Accepted for verification; repeated completion is idempotent.
          headers:
            Cache-Control:
              schema: {type: string, example: 'no-store'}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadStatus'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/stations:
    get:
      summary: Directory search (anonymous).
      operationId: searchStations
      tags: [directory]
      security: []
      parameters:
        - name: state
          in: query
          description: Federative unit filter.
          schema: {type: string, minLength: 2, maxLength: 2}
          example: SP
        - name: municipality_code
          in: query
          description: IBGE municipality code filter.
          schema: {type: string, minLength: 1, maxLength: 16}
          example: '3550308'
        - name: q
          in: query
          description: Display-name substring filter.
          schema: {type: string, minLength: 2, maxLength: 100}
          example: Posto Central
        - name: limit
          in: query
          description: Results per page.
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
          example: 20
        - name: cursor
          in: query
          description: Opaque cursor continuing the search.
          schema: {type: string}
      responses:
        '200':
          description: Station page, ID order.
          headers:
            Cache-Control:
              schema: {type: string, example: 'public, max-age=60'}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StationList'
              example:
                items: []
                next_cursor: null
                generated_at: '2026-09-28T00:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
  /v1/stations/nearby:
    get:
      summary: Nearby stations (anonymous, never stored).
      operationId: nearbyStations
      tags: [directory]
      security: []
      parameters:
        - name: lat
          in: query
          required: true
          description: Request latitude; never returned, logged or cached.
          schema: {type: number, minimum: -90, maximum: 90}
          example: -23.55
        - name: lon
          in: query
          required: true
          description: Request longitude; never returned, logged or cached.
          schema: {type: number, minimum: -180, maximum: 180}
          example: -46.63
        - name: radius_m
          in: query
          description: Search radius in metres.
          schema: {type: integer, minimum: 100, maximum: 15000, default: 3000}
          example: 3000
        - name: limit
          in: query
          description: Nearby page size.
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
          example: 20
        - name: cursor
          in: query
          description: Opaque cursor continuing nearby results.
          schema: {type: string}
      responses:
        '200':
          description: Stations by distance, never echoing the request point.
          headers:
            Cache-Control:
              schema: {type: string, example: 'no-store'}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NearbyResult'
              example:
                items: []
                next_cursor: null
                generated_at: '2026-09-28T00:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
  /v1/stations/{station_id}:
    get:
      summary: Station metadata with coordinate provenance (anonymous).
      operationId: getStation
      tags: [directory]
      security: []
      parameters:
        - name: station_id
          in: path
          required: true
          description: Station path identifier.
          schema: {type: string, format: uuid}
          example: d6c74c23-63db-4c24-a2e5-408cb23bad26
      responses:
        '200':
          description: Public station fields; coordinates only when reviewed.
          headers:
            ETag:
              schema: {type: string}
            Cache-Control:
              schema: {type: string, example: 'public, max-age=30, s-maxage=60'}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Station'
              example:
                station_id: d6c74c23-63db-4c24-a2e5-408cb23bad26
                display_name: Posto Central
                cnpj_normalized: '04218406000104'
                location_quality: reviewed
                coordinates: {lat: -23.55, lon: -46.63}
                current_revision_id: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/stations/{station_id}/prices:
    get:
      summary: Product groups with official and community sections (anonymous).
      operationId: stationPrices
      tags: [directory]
      security: []
      parameters:
        - name: station_id
          in: path
          required: true
          description: Priced station identifier.
          schema: {type: string, format: uuid}
          example: d6c74c23-63db-4c24-a2e5-408cb23bad26
        - name: fuel_product
          in: query
          description: Optional fuel filter for groups.
          schema: {$ref: '#/components/schemas/FuelProduct'}
          example: GASOLINE_REGULAR
      responses:
        '200':
          description: Groups per product/unit/condition; community null until P04.
          headers:
            ETag:
              schema: {type: string}
            Cache-Control:
              schema: {type: string, example: 'public, max-age=60'}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceGroups'
              example:
                items: []
                generated_at: '2026-09-28T00:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/stations/{station_id}/official-prices:
    get:
      summary: Revision-aware official price history (anonymous).
      operationId: officialPriceHistory
      tags: [official]
      security: []
      parameters:
        - name: station_id
          in: path
          required: true
          description: History station identifier.
          schema: {type: string, format: uuid}
          example: d6c74c23-63db-4c24-a2e5-408cb23bad26
        - name: fuel_product
          in: query
          description: Optional product filter.
          schema: {$ref: '#/components/schemas/FuelProduct'}
          example: GASOLINE_REGULAR
        - name: revision_id
          in: query
          description: Canonical station identifier.
          schema: {type: string, format: uuid}
          example: d6c74c23-63db-4c24-a2e5-408cb23bad26
        - name: limit
          in: query
          description: Owner history page size.
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
          example: 20
        - name: cursor
          in: query
          description: Opaque page cursor from the previous response.
          schema: {type: string}
      responses:
        '200':
          description: History across published revisions, newest first.
          headers:
            ETag:
              schema: {type: string}
            Cache-Control:
              schema: {type: string, example: 'public, max-age=60'}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfficialPriceHistory'
              example:
                items: []
                next_cursor: null
                generated_at: '2026-09-28T00:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  schemas:
    Money:
      description: >
        Exact price in thousandths of a real. Positive integer 1..1000000
        per B-BR-002; no float. Unit semantics per A04: L covers
        per-litre fuels, M3 is CNG per cubic metre, KG_13 is LPG per 13 kg
        cylinder.
      type: object
      required: [amount_milli_brl, currency, unit]
      example:
        amount_milli_brl: 6030
        currency: BRL
        unit: L
      properties:
        amount_milli_brl:
          type: integer
          minimum: 1
          maximum: 1000000
          example: 6030
        currency:
          type: string
          enum: [BRL]
          example: BRL
        unit:
          $ref: '#/components/schemas/PriceUnit'
    PriceUnit:
      description: Physical unit of the amount. Fixed per product in v1.
      type: string
      enum: [L, M3, KG_13]
      example: L
    FuelProduct:
      description: >
        Backend wire vocabulary per D04. Legacy Android GASOLINE_PREMIUM
        (GASOLINA ADITIVADA) maps only through a named Android adapter in
        P10 and never appears on the wire (A05).
      type: string
      enum: [ETHANOL, GASOLINE_REGULAR, GASOLINE_ADDITIVED, DIESEL_S500, DIESEL_S10, CNG, LPG_P13]
      example: GASOLINE_ADDITIVED
    PriceCondition:
      description: >
        Sale condition. STANDARD forbids qualifier_id (mirrored
        structurally below); APP/LOYALTY/OTHER qualifier recognition is
        domain-enforced. Unknown condition is never STANDARD.
      type: object
      required: [kind]
      example:
        kind: STANDARD
        qualifier_id: null
      properties:
        kind:
          type: string
          enum: [STANDARD, CASH, DEBIT, CREDIT, APP, LOYALTY, OTHER]
        qualifier_id:
          type: [string, "null"]
          format: uuid
          description: Recognized app/program restriction, or null.
      not:
        required: [kind, qualifier_id]
        properties:
          kind:
            const: STANDARD
          qualifier_id:
            type: string
            minLength: 1
    ApiError:
      description: >
        Stable machine code plus safe display text. No SQL, keys, raw input
        or precise coordinates in any field.
      type: object
      required: [error]
      example:
        error:
          code: observation.conflict
          message: safe display text
          trace_id: req-abc-123
          details:
            - field: client_submission_id
              code: conflict
      properties:
        error:
          type: object
          required: [code, message, trace_id]
          properties:
            code:
              type: string
              minLength: 1
              example: observation.conflict
            message:
              type: string
              description: Safe display text; clients localize via code.
            trace_id:
              type: string
              description: Request ID for operator correlation.
            details:
              type: array
              items:
                type: object
                required: [field, code]
                properties:
                  field:
                    type: string
                  code:
                    type: string
    HealthStatus:
      description: Minimal liveness/readiness envelope.
      type: object
      required: [status]
      example:
        status: ok
      properties:
        status:
          type: string
          enum: [ok, ready, not_ready]
    Station:
      description: >
        Public station fields. Coordinates appear only for reviewed
        projections; missing locations stay honest nulls, never fabrications.
      type: object
      required: [station_id, display_name, location_quality]
      properties:
        station_id:
          type: string
          format: uuid
          example: d6c74c23-63db-4c24-a2e5-408cb23bad26
        display_name:
          type: string
          example: Posto Central
        address:
          type: [object, "null"]
          description: Source address components verbatim.
          example: {logradouro: AV PAULISTA, numero: '1000', municipio: SAO PAULO, uf: SP}
        cnpj_normalized:
          type: [string, "null"]
          example: "04218406000104"
        municipality_code:
          type: [string, "null"]
          example: '3550308'
        state:
          type: [string, "null"]
          minLength: 2
          maxLength: 2
          example: SP
        location_quality:
          type: string
          enum: [unknown, city-centroid, reviewed]
          example: reviewed
        coordinates:
          type: [object, "null"]
          required: [lat, lon]
          example: {lat: -23.55, lon: -46.63}
          properties:
            lat: {type: number, minimum: -90, maximum: 90}
            lon: {type: number, minimum: -180, maximum: 180}
        current_revision_id:
          type: [string, "null"]
          format: uuid
          example: null
    StationList:
      description: Paginated station search page.
      type: object
      required: [items, generated_at]
      properties:
        items:
          type: array
          example: []
          items: {$ref: '#/components/schemas/Station'}
        next_cursor:
          type: [string, "null"]
          example: null
        generated_at:
          type: string
          format: date-time
          example: '2026-09-28T00:00:00Z'
    NearbyStation:
      description: Station with public distance.
      allOf:
        - $ref: '#/components/schemas/Station'
        - type: object
          required: [distance_m]
          properties:
            distance_m: {type: number, minimum: 0}
    NearbyResult:
      description: Nearby page; request point never echoed.
      type: object
      required: [items, generated_at]
      properties:
        items:
          type: array
          example: []
          items: {$ref: '#/components/schemas/NearbyStation'}
        next_cursor:
          type: [string, "null"]
          example: null
        generated_at:
          type: string
          format: date-time
          example: '2026-09-28T00:00:00Z'
    PriceGroup:
      description: >
        One product/unit/condition group with independent official and
        community sections. Community stays null until P04; a null is
        UNKNOWN, never an ANP substitution (B-BR-001).
      type: object
      required: [station_id, fuel_product, unit, condition]
      properties:
        station_id: {type: string, format: uuid}
        fuel_product: {$ref: '#/components/schemas/FuelProduct'}
        unit: {$ref: '#/components/schemas/PriceUnit'}
        condition:
          type: object
          required: [kind]
          properties:
            kind: {type: string, enum: [STANDARD]}
            qualifier_id: {type: ["null"], example: null}
        official:
          type: [object, "null"]
          required: [source, amount_milli_brl, currency, collected_on, survey_week, revision_id]
          properties:
            source: {type: string, enum: [ANP]}
            amount_milli_brl: {type: integer, minimum: 1, maximum: 1000000}
            currency: {type: string, enum: [BRL]}
            collected_on: {type: string, format: date}
            survey_week:
              type: object
              required: [start, end]
              properties:
                start: {type: string, format: date}
                end: {type: string, format: date}
            revision_id: {type: string, format: uuid}
        community: {type: ["null"], example: null}
    PriceGroups:
      description: Product groups with official and community sections.
      type: object
      required: [items, generated_at]
      properties:
        items:
          type: array
          example: []
          items: {$ref: '#/components/schemas/PriceGroup'}
        generated_at:
          type: string
          format: date-time
          example: '2026-09-28T00:00:00Z'
    OfficialPriceEntry:
      description: One published official price with provenance.
      type: object
      required: [revision_id, survey_week, collected_on, fuel_product, unit, amount_milli_brl, currency, source]
      properties:
        revision_id: {type: string, format: uuid}
        survey_week:
          type: object
          required: [start, end]
          properties:
            start: {type: string, format: date}
            end: {type: string, format: date}
        collected_on: {type: string, format: date}
        fuel_product: {$ref: '#/components/schemas/FuelProduct'}
        unit: {$ref: '#/components/schemas/PriceUnit'}
        amount_milli_brl: {type: integer, minimum: 1, maximum: 1000000}
        currency: {type: string, enum: [BRL]}
        source:
          type: object
          required: [kind, url, checksum]
          properties:
            kind: {type: string, enum: [ANP]}
            url: {type: string}
            checksum: {type: string}
    OfficialPriceHistory:
      description: Revision-aware official history page.
      type: object
      required: [items, generated_at]
      properties:
        items:
          type: array
          example: []
          items: {$ref: '#/components/schemas/OfficialPriceEntry'}
        next_cursor:
          type: [string, "null"]
          example: null
        generated_at:
          type: string
          format: date-time
          example: '2026-09-28T00:00:00Z'
    ChallengeRequest:
      description: Fingerprint plus purpose for a bound challenge.
      type: object
      required: [fingerprint, purpose]
      properties:
        fingerprint:
          type: string
          description: Key fingerprint the challenge binds to.
          example: fp:e568c4f52605d14215f6e649000e4ffc2da4caa4bdcbbf2b8bcd9937ff9ea624
        purpose:
          type: string
          enum: [REGISTER, SIGN]
          example: REGISTER
    Challenge:
      description: Single-use bound challenge; proof must consume it once.
      type: object
      required: [challenge_id, nonce, fingerprint, purpose, expires_at]
      properties:
        challenge_id:
          type: string
          format: uuid
          example: d6c74c23-63db-4c24-a2e5-408cb23bad26
        nonce:
          type: string
          description: Server nonce the proof signs over.
          example: d6c74c23-63db-4c24-a2e5-408cb23bad26.9f2c4a7e8b1d3f5a
        fingerprint:
          type: string
          example: fp:e568c4f52605d14215f6e649000e4ffc2da4caa4bdcbbf2b8bcd9937ff9ea624
        purpose:
          type: string
          enum: [REGISTER, SIGN]
          example: REGISTER
        expires_at:
          type: string
          format: date-time
          example: '2026-09-28T00:05:00Z'
    PublicJWK:
      description: P-256 public key; private material never crosses the wire.
      type: object
      required: [kty, crv, x, y]
      properties:
        kty: {type: string, enum: [EC], example: EC}
        crv: {type: string, enum: [P-256], example: P-256}
        x:
          type: string
          description: Base64url 32-byte X coordinate.
          example: 5H8pdbqwCE7YcVh0t7VNWgcQVrZ4S66TjfwBDE8tneE
        y:
          type: string
          description: Base64url 32-byte Y coordinate.
          example: WpcgI0Z8gndT_z9lTn8qgoevjDFsjVAlRvfpo6-KJIs
    ContributorRegistration:
      description: Candidate key plus challenge proof over the live request.
      type: object
      required: [public_jwk, challenge_id, proof]
      properties:
        public_jwk:
          $ref: '#/components/schemas/PublicJWK'
        challenge_id:
          type: string
          format: uuid
          example: d6c74c23-63db-4c24-a2e5-408cb23bad26
        proof:
          type: object
          required: [lines, signature]
          properties:
            lines:
              type: array
              description: Covered base lines in frozen order.
              example: ['"@method": POST']
              items: {type: string}
            signature:
              type: string
              description: Base64url raw 64-byte signature.
              example: MEUCIQ
    Contributor:
      description: Key-owned anonymous identity; duplicates return existing.
      type: object
      required: [contributor_id, key_id, existed]
      properties:
        contributor_id:
          type: string
          format: uuid
          example: d6c74c23-63db-4c24-a2e5-408cb23bad26
        key_id:
          type: string
          format: uuid
          example: aac027be-d331-40e4-8d63-52ec3b8d2f41
        existed:
          type: boolean
          description: True when the key already owned this identity.
          example: false
    RotationProof:
      description: One signed side of a rotation bound to its challenge.
      type: object
      required: [challenge_id, lines, signature]
      properties:
        challenge_id:
          type: string
          format: uuid
          example: d6c74c23-63db-4c24-a2e5-408cb23bad26
        lines:
          type: array
          description: Rotation covered lines in frozen order.
          example: ['"@method": POST']
          items: {type: string}
        signature:
          type: string
          description: Base64url raw 64-byte rotation signature.
          example: MEUCIQ
    KeyRotation:
      description: Rotation request with both proofs and the candidate key.
      type: object
      required: [old, new_jwk, new]
      properties:
        old:
          $ref: '#/components/schemas/RotationProof'
        new_jwk:
          $ref: '#/components/schemas/PublicJWK'
        new:
          $ref: '#/components/schemas/RotationProof'
    Rotation:
      description: Preserved contributor with revoked old and bound new key.
      type: object
      required: [contributor_id, old_key_id, new_key_id, existed]
      properties:
        contributor_id:
          type: string
          format: uuid
          example: d6c74c23-63db-4c24-a2e5-408cb23bad26
        old_key_id:
          type: string
          format: uuid
          example: aac027be-d331-40e4-8d63-52ec3b8d2f41
        new_key_id:
          type: string
          format: uuid
          example: bbd138ce-e442-4f57-a874-3c05d2e16f52
        existed:
          type: boolean
          description: True when replaying an already completed rotation.
          example: false
    ObservationSubmit:
      description: Submission content; identity derives from proof, never the body.
      type: object
      required: [client_submission_id, station_id, fuel_product, price, condition]
      properties:
        client_submission_id:
          type: string
          description: Client operation identity for safe retries.
          example: sub-2026-09-28-001
        station_id:
          type: string
          format: uuid
          example: d6c74c23-63db-4c24-a2e5-408cb23bad26
        fuel_product:
          $ref: '#/components/schemas/FuelProduct'
        price:
          type: object
          required: [amount_milli_brl, currency, unit]
          properties:
            amount_milli_brl:
              type: integer
              minimum: 1
              maximum: 1000000
              example: 5999
            currency:
              type: string
              enum: [BRL]
              example: BRL
            unit:
              $ref: '#/components/schemas/PriceUnit'
        condition:
          type: object
          required: [kind]
          properties:
            kind:
              type: string
              enum: [STANDARD, CASH, DEBIT, CREDIT, APP, LOYALTY, OTHER]
              example: STANDARD
            qualifier_id:
              type: [string, "null"]
              example: null
        evidence_id:
          type: [string, "null"]
          format: uuid
          example: null
        claimed_captured_at:
          type: [string, "null"]
          format: date-time
          example: null
        supersedes_observation_id:
          type: [string, "null"]
          format: uuid
          example: null
    ObservationReceipt:
      description: Safe acknowledgment; RECEIVED never claims publication.
      type: object
      required: [id, validation_state, received_at, status_url]
      properties:
        id:
          type: string
          format: uuid
          example: d6c74c23-63db-4c24-a2e5-408cb23bad27
        validation_state:
          type: string
          enum: [RECEIVED]
          example: RECEIVED
        received_at:
          type: string
          format: date-time
          example: '2026-09-28T00:00:00Z'
        status_url:
          type: string
          example: /v1/observations/d6c74c23-63db-4c24-a2e5-408cb23bad27
    Observation:
      description: Stored fact with derived validation state.
      type: object
      required: [id, station_id, fuel_product, unit, amount_milli_brl, condition, validation_state, received_at, policy_version]
      properties:
        id:
          type: string
          format: uuid
          example: d6c74c23-63db-4c24-a2e5-408cb23bad27
        station_id:
          type: string
          format: uuid
          example: d6c74c23-63db-4c24-a2e5-408cb23bad26
        fuel_product:
          $ref: '#/components/schemas/FuelProduct'
        unit:
          $ref: '#/components/schemas/PriceUnit'
        amount_milli_brl:
          type: integer
          minimum: 1
          maximum: 1000000
          example: 5999
        condition:
          type: object
          required: [kind]
          properties:
            kind:
              type: string
              enum: [STANDARD, CASH, DEBIT, CREDIT, APP, LOYALTY, OTHER]
              example: STANDARD
            qualifier_id:
              type: [string, "null"]
              example: null
        validation_state:
          type: string
          enum: [RECEIVED, VALIDATING, VALIDATED, REJECTED]
          example: RECEIVED
        received_at:
          type: string
          format: date-time
          example: '2026-09-28T00:00:00Z'
        policy_version:
          type: string
          example: community-pricing-v1
    ObservationStatus:
      description: Owned fact with state and decision timeline.
      type: object
      required: [observation, validation_state, decisions]
      properties:
        observation:
          $ref: '#/components/schemas/Observation'
        validation_state:
          type: string
          enum: [RECEIVED, VALIDATING, VALIDATED, REJECTED]
          example: RECEIVED
        decisions:
          type: array
          description: Decision timeline in sequence order.
          example: []
          items:
            type: object
            required: [sequence, to_state, occurred_at, actor]
            properties:
              sequence: {type: integer, example: 1}
              to_state: {type: string, example: VALIDATING}
              reason_codes: {type: array, items: {type: string}}
              occurred_at: {type: string, format: date-time}
              actor: {type: string, example: worker}
    ObservationHistory:
      description: Owner facts page with cursor.
      type: object
      required: [items, generated_at]
      properties:
        items:
          type: array
          description: Newest-first owner facts.
          example: []
          items: {$ref: '#/components/schemas/Observation'}
        next_cursor:
          type: [string, "null"]
          example: null
        generated_at:
          type: string
          format: date-time
          example: '2026-09-28T00:00:00Z'
    UploadReserveRequest:
      description: Upload intent; the object key is server-generated, never client-supplied.
      type: object
      required: [client_submission_id, content_type, size_bytes, sha256]
      properties:
        client_submission_id:
          type: string
          minLength: 1
          description: Client operation identity for safe retries.
          example: upl-2026-09-30-001
        content_type:
          type: string
          enum: [image/jpeg]
          example: image/jpeg
        size_bytes:
          type: integer
          minimum: 1
          maximum: 3145728
          description: Declared intent only; actual length is verified after upload.
          example: 524288
        sha256:
          type: string
          pattern: '^[0-9a-fA-F]{64}$'
          description: Client hash claim, verified after upload.
          example: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    UploadReservation:
      description: Reserved session with a short direct PUT authorization.
      type: object
      required: [upload_id, method, url, required_headers, expires_at, max_bytes]
      properties:
        upload_id:
          type: string
          format: uuid
          example: e0000000-0000-4000-8000-000000000001
        method:
          type: string
          enum: [PUT]
          example: PUT
        url:
          type: string
          format: uri
          description: Short presigned PUT bound to one quarantine key; transport only, never a size bound.
          example: https://xxx.r2.cloudflarestorage.com/anpfuel-quarantine/q/e0000000000000000000000000000001?X-Amz-Algorithm=AWS4-HMAC-SHA256
        required_headers:
          type: object
          required: [content-type]
          properties:
            content-type:
              type: string
              enum: [image/jpeg]
              example: image/jpeg
        expires_at:
          type: string
          format: date-time
          example: '2026-09-30T12:05:00Z'
        max_bytes:
          type: integer
          example: 3145728
    UploadState:
      description: Upload session lifecycle state.
      type: string
      enum: [ISSUED, VERIFYING, READY, REJECTED, EXPIRED]
      example: ISSUED
    UploadStatus:
      description: Owner session state; READY carries the evidence id, never an object URL.
      type: object
      required: [upload_id, state, updated_at]
      properties:
        upload_id:
          type: string
          format: uuid
          example: e0000000-0000-4000-8000-000000000001
        state:
          $ref: '#/components/schemas/UploadState'
        evidence_id:
          type: [string, "null"]
          format: uuid
          description: Bound evidence reference once READY; null otherwise.
          example: null
        updated_at:
          type: string
          format: date-time
          example: '2026-09-30T12:00:00Z'
  responses:
    BadRequest:
      description: Malformed input, cursor or bounds.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: Missing resource; no ownership oracle.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unauthorized:
      description: Missing or invalid proof; no detail leaks.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Conflict:
      description: Same key, different body.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    RateLimited:
      description: Quota exhausted; honor Retry-After.
      headers:
        Retry-After:
          schema: {type: integer, example: 60}
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
