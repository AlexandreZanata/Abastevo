  /v1/accounts/bindings/bind:
    post:
      summary: Bind a device contributor to the caller's account.
      operationId: bindContributor
      tags: [accounts]
      security: []
      description: >
        Dual-proof ceremony (P13-T04, B-BR-A04): the live account
        session plus a device-key proof over the ceremony statement.
        The account derives server-side; a contributor bound to another
        account refuses with 403, so recovery never transfers
        reputation.
      requestBody:
        required: true
        description: Live session plus contributor and key proof.
        content:
          application/json:
            schema:
              type: object
              required: [family_id, access_token, contributor_id, proof]
              properties:
                family_id:
                  type: string
                  format: uuid
                  example: aac027be-d331-40e4-8d63-52ec3b8d2f41
                access_token:
                  type: string
                  example: tok-access
                contributor_id:
                  type: string
                  description: Anonymous contributor to bind.
                  example: c0000000-0000-4000-8000-000000000001
                proof:
                  type: string
                  description: Device-key proof over the ceremony statement.
                  example: fp:9f2c4a1b3d5e6f708192a3b4c5d6e7f8091a2b3c4d5e6f708192a3b4c5d6e7f8.1798765432.c2ln
      responses:
        '200':
          description: Contributor bound to the caller account.
          headers:
            Cache-Control:
              schema: {type: string, example: 'no-store'}
          content:
            application/json:
              schema:
                type: object
                required: [binding]
                properties:
                  binding:
                    $ref: '#/components/schemas/ContributorBinding'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '410':
