components:
  schemas:
    Money:
      description: >
        Exact price in thousandths of a real. Positive integer 1..1000000
        per B-BR-002; no float. Unit semantics per A04: L covers
        per-litre fuels, M3 is CNG per cubic metre, KG_13 is LPG per 13 kg
        cylinder.
      type: object
      required: [amount_milli_brl, currency, unit]
      example:
        amount_milli_brl: 6030
        currency: BRL
        unit: L
      properties:
        amount_milli_brl:
          type: integer
          minimum: 1
          maximum: 1000000
          example: 6030
        currency:
          type: string
          enum: [BRL]
          example: BRL
        unit:
          $ref: '#/components/schemas/PriceUnit'
    PriceUnit:
      description: Physical unit of the amount. Fixed per product in v1.
      type: string
      enum: [L, M3, KG_13]
      example: L
    FuelProduct:
      description: >
        Backend wire vocabulary per D04. Legacy Android GASOLINE_PREMIUM
        (GASOLINA ADITIVADA) maps only through a named Android adapter in
        P10 and never appears on the wire (A05).
      type: string
      enum: [ETHANOL, GASOLINE_REGULAR, GASOLINE_ADDITIVED, DIESEL_S500, DIESEL_S10, CNG, LPG_P13]
      example: GASOLINE_ADDITIVED
    PriceCondition:
      description: >
        Sale condition. STANDARD forbids qualifier_id (mirrored
        structurally below); APP/LOYALTY/OTHER qualifier recognition is
        domain-enforced. Unknown condition is never STANDARD.
      type: object
      required: [kind]
      example:
        kind: STANDARD
        qualifier_id: null
      properties:
        kind:
          type: string
          enum: [STANDARD, CASH, DEBIT, CREDIT, APP, LOYALTY, OTHER]
        qualifier_id:
          type: [string, "null"]
          format: uuid
          description: Recognized app/program restriction, or null.
      not:
        required: [kind, qualifier_id]
        properties:
          kind:
            const: STANDARD
          qualifier_id:
            type: string
            minLength: 1
    ApiError:
      description: >
        Stable machine code plus safe display text. No SQL, keys, raw input
        or precise coordinates in any field.
      type: object
      required: [error]
      example:
        error:
          code: observation.conflict
          message: safe display text
          trace_id: req-abc-123
          details:
            - field: client_submission_id
              code: conflict
      properties:
        error:
          type: object
          required: [code, message, trace_id]
          properties:
            code:
              type: string
              minLength: 1
              example: observation.conflict
            message:
              type: string
              description: Safe display text; clients localize via code.
            trace_id:
              type: string
              description: Request ID for operator correlation.
            details:
              type: array
              items:
                type: object
                required: [field, code]
                properties:
                  field:
                    type: string
                  code:
                    type: string
    HealthStatus:
      description: Minimal liveness/readiness envelope.
      type: object
      required: [status]
      example:
        status: ok
      properties:
        status:
          type: string
          enum: [ok, ready, not_ready]
    Station:
      description: >
        Public station fields. Coordinates appear only for reviewed
        projections; missing locations stay honest nulls, never fabrications.
      type: object
      required: [station_id, display_name, location_quality]
      properties:
        station_id:
          type: string
          format: uuid
          example: d6c74c23-63db-4c24-a2e5-408cb23bad26
        display_name:
          type: string
          example: Posto Central
        address:
          type: [object, "null"]
          description: Source address components verbatim.
          example: {logradouro: AV PAULISTA, numero: '1000', municipio: SAO PAULO, uf: SP}
        cnpj_normalized:
          type: [string, "null"]
          example: "04218406000104"
        municipality_code:
          type: [string, "null"]
          example: '3550308'
        state:
          type: [string, "null"]
          minLength: 2
          maxLength: 2
          example: SP
        location_quality:
          type: string
          enum: [unknown, city-centroid, reviewed]
          example: reviewed
        coordinates:
          type: [object, "null"]
          required: [lat, lon]
          example: {lat: -23.55, lon: -46.63}
          properties:
            lat: {type: number, minimum: -90, maximum: 90}
            lon: {type: number, minimum: -180, maximum: 180}
        current_revision_id:
          type: [string, "null"]
          format: uuid
          example: null
    StationList:
      description: Paginated station search page.
      type: object
      required: [items, generated_at]
      properties:
        items:
          type: array
          example: []
          items: {$ref: '#/components/schemas/Station'}
        next_cursor:
          type: [string, "null"]
          example: null
        generated_at:
          type: string
          format: date-time
          example: '2026-09-28T00:00:00Z'
    NearbyStation:
      description: Station with public distance.
      allOf:
        - $ref: '#/components/schemas/Station'
        - type: object
          required: [distance_m]
          properties:
            distance_m: {type: number, minimum: 0}
    NearbyResult:
      description: Nearby page; request point never echoed.
      type: object
      required: [items, generated_at]
      properties:
        items:
          type: array
          example: []
          items: {$ref: '#/components/schemas/NearbyStation'}
        next_cursor:
          type: [string, "null"]
          example: null
        generated_at:
          type: string
          format: date-time
          example: '2026-09-28T00:00:00Z'
    PriceGroup:
      description: >
        One product/unit/condition group with independent official and
        community sections. Community stays null until P04; a null is
        UNKNOWN, never an ANP substitution (B-BR-001).
      type: object
      required: [station_id, fuel_product, unit, condition]
      properties:
        station_id: {type: string, format: uuid}
        fuel_product: {$ref: '#/components/schemas/FuelProduct'}
        unit: {$ref: '#/components/schemas/PriceUnit'}
        condition:
          type: object
          required: [kind]
          properties:
            kind: {type: string, enum: [STANDARD]}
            qualifier_id: {type: ["null"], example: null}
        official:
          type: [object, "null"]
          required: [source, amount_milli_brl, currency, collected_on, survey_week, revision_id]
          properties:
            source: {type: string, enum: [ANP]}
            amount_milli_brl: {type: integer, minimum: 1, maximum: 1000000}
            currency: {type: string, enum: [BRL]}
            collected_on: {type: string, format: date}
            survey_week:
              type: object
              required: [start, end]
              properties:
                start: {type: string, format: date}
                end: {type: string, format: date}
            revision_id: {type: string, format: uuid}
        community:
          description: Projected community section, or null when unknown (never an ANP substitution).
          example: null
          oneOf:
            - type: "null"
            - $ref: '#/components/schemas/CommunityPrice'
    CommunityPrice:
      description: Projected community section with explanatory counts and freshness, never contributor identities.
      type: object
      required: [source, availability, currency, confidence, freshness, independent_supporters, confirmation_count, algorithm_version, projection_version]
      properties:
        source:
          type: string
          enum: [COMMUNITY]
          example: COMMUNITY
        availability:
          type: string
          enum: [AVAILABLE, DISPUTED, UNKNOWN]
          example: AVAILABLE
        amount_milli_brl:
          type: [integer, "null"]
          minimum: 1
          maximum: 1000000
          description: Projected amount, null unless AVAILABLE.
          example: 5890
        currency:
          type: string
          enum: [BRL]
          example: BRL
        confidence:
          type: string
          example: MEDIUM
        freshness:
          type: string
          enum: [FRESH, AGING, STALE, UNKNOWN]
          example: FRESH
        independent_supporters:
          type: integer
          minimum: 0
          example: 2
        confirmation_count:
          type: integer
          minimum: 0
          example: 1
        representative_observation_id:
          type: [string, "null"]
          format: uuid
          description: Eligible anchor bound to the displayed amount, for confirmation and dispute targeting.
          example: 45d0e8bc-01b1-441e-9b28-f8c16df7cb35
        last_observation_received_at:
          type: [string, "null"]
          format: date-time
          example: '2026-09-28T12:00:00Z'
        expires_at:
          type: [string, "null"]
          format: date-time
          example: '2026-09-30T12:00:00Z'
        algorithm_version:
          type: string
          example: consensus-v1
        projection_version:
          type: integer
          minimum: 1
          example: 7
    PriceGroups:
      description: Product groups with official and community sections.
      type: object
      required: [items, generated_at]
      properties:
        items:
          type: array
          example: []
          items: {$ref: '#/components/schemas/PriceGroup'}
        generated_at:
          type: string
          format: date-time
          example: '2026-09-28T00:00:00Z'
    OfficialPriceEntry:
      description: One published official price with provenance.
      type: object
      required: [revision_id, survey_week, collected_on, fuel_product, unit, amount_milli_brl, currency, source]
      properties:
        revision_id: {type: string, format: uuid}
        survey_week:
          type: object
          required: [start, end]
          properties:
            start: {type: string, format: date}
            end: {type: string, format: date}
        collected_on: {type: string, format: date}
        fuel_product: {$ref: '#/components/schemas/FuelProduct'}
        unit: {$ref: '#/components/schemas/PriceUnit'}
        amount_milli_brl: {type: integer, minimum: 1, maximum: 1000000}
        currency: {type: string, enum: [BRL]}
        source:
          type: object
          required: [kind, url, checksum]
          properties:
            kind: {type: string, enum: [ANP]}
            url: {type: string}
            checksum: {type: string}
    OfficialPriceHistory:
      description: Revision-aware official history page.
      type: object
      required: [items, generated_at]
      properties:
        items:
          type: array
          example: []
          items: {$ref: '#/components/schemas/OfficialPriceEntry'}
        next_cursor:
          type: [string, "null"]
          example: null
        generated_at:
          type: string
          format: date-time
          example: '2026-09-28T00:00:00Z'
    ChallengeRequest:
      description: Fingerprint plus purpose for a bound challenge.
      type: object
      required: [fingerprint, purpose]
      properties:
        fingerprint:
          type: string
          description: Key fingerprint the challenge binds to.
          example: fp:e568c4f52605d14215f6e649000e4ffc2da4caa4bdcbbf2b8bcd9937ff9ea624
        purpose:
          type: string
          enum: [REGISTER, SIGN]
          example: REGISTER
    Challenge:
      description: Single-use bound challenge; proof must consume it once.
      type: object
      required: [challenge_id, nonce, fingerprint, purpose, expires_at]
      properties:
        challenge_id:
          type: string
          format: uuid
          example: d6c74c23-63db-4c24-a2e5-408cb23bad26
        nonce:
          type: string
          description: Server nonce the proof signs over.
          example: d6c74c23-63db-4c24-a2e5-408cb23bad26.9f2c4a7e8b1d3f5a
        fingerprint:
          type: string
          example: fp:e568c4f52605d14215f6e649000e4ffc2da4caa4bdcbbf2b8bcd9937ff9ea624
        purpose:
          type: string
          enum: [REGISTER, SIGN]
          example: REGISTER
        expires_at:
          type: string
          format: date-time
          example: '2026-09-28T00:05:00Z'
    PublicJWK:
      description: P-256 public key; private material never crosses the wire.
      type: object
      required: [kty, crv, x, y]
      properties:
        kty: {type: string, enum: [EC], example: EC}
        crv: {type: string, enum: [P-256], example: P-256}
        x:
          type: string
          description: Base64url 32-byte X coordinate.
          example: 5H8pdbqwCE7YcVh0t7VNWgcQVrZ4S66TjfwBDE8tneE
        y:
          type: string
          description: Base64url 32-byte Y coordinate.
          example: WpcgI0Z8gndT_z9lTn8qgoevjDFsjVAlRvfpo6-KJIs
    ContributorRegistration:
      description: Candidate key plus challenge proof over the live request.
      type: object
      required: [public_jwk, challenge_id, proof]
      properties:
        public_jwk:
          $ref: '#/components/schemas/PublicJWK'
        challenge_id:
          type: string
          format: uuid
          example: d6c74c23-63db-4c24-a2e5-408cb23bad26
        proof:
          type: object
          required: [lines, signature]
          properties:
            lines:
              type: array
              description: Covered base lines in frozen order.
              example: ['"@method": POST']
              items: {type: string}
            signature:
              type: string
              description: Base64url raw 64-byte signature.
              example: MEUCIQ
    Contributor:
      description: Key-owned anonymous identity; duplicates return existing.
      type: object
      required: [contributor_id, key_id, existed]
      properties:
        contributor_id:
          type: string
          format: uuid
          example: d6c74c23-63db-4c24-a2e5-408cb23bad26
        key_id:
          type: string
          format: uuid
          example: aac027be-d331-40e4-8d63-52ec3b8d2f41
        existed:
          type: boolean
          description: True when the key already owned this identity.
          example: false
    RotationProof:
      description: One signed side of a rotation bound to its challenge.
      type: object
      required: [challenge_id, lines, signature]
      properties:
        challenge_id:
          type: string
          format: uuid
          example: d6c74c23-63db-4c24-a2e5-408cb23bad26
        lines:
          type: array
          description: Rotation covered lines in frozen order.
          example: ['"@method": POST']
          items: {type: string}
        signature:
          type: string
          description: Base64url raw 64-byte rotation signature.
          example: MEUCIQ
    KeyRotation:
      description: Rotation request with both proofs and the candidate key.
      type: object
      required: [old, new_jwk, new]
      properties:
        old:
          $ref: '#/components/schemas/RotationProof'
        new_jwk:
          $ref: '#/components/schemas/PublicJWK'
        new:
          $ref: '#/components/schemas/RotationProof'
    Rotation:
      description: Preserved contributor with revoked old and bound new key.
      type: object
      required: [contributor_id, old_key_id, new_key_id, existed]
      properties:
        contributor_id:
          type: string
          format: uuid
          example: d6c74c23-63db-4c24-a2e5-408cb23bad26
        old_key_id:
          type: string
          format: uuid
          example: aac027be-d331-40e4-8d63-52ec3b8d2f41
        new_key_id:
          type: string
          format: uuid
          example: bbd138ce-e442-4f57-a874-3c05d2e16f52
        existed:
          type: boolean
          description: True when replaying an already completed rotation.
          example: false
    Account:
      description: >
        FREE account (P13-T01, B-BR-A01): email-code, Google or Apple signup
        with no purchase prerequisite. Additive preview schemas only;
        implemented v1 paths are untouched. Handlers land in
        P13-T02/T03/T04.
      type: object
      required: [account_id, public_alias, status, created_at]
      properties:
        account_id:
          type: string
          format: uuid
          example: d6c74c23-63db-4c24-a2e5-408cb23bad26
        public_alias:
          type: string
          description: Opaque display name; never email, provider subject or GPS.
          example: adore-fox-42
        status:
          type: string
          enum: [active, suspended, deleted]
          example: active
        created_at:
          type: string
          format: date-time
          example: 2026-10-01T00:00:00Z
    ContributorBinding:
      description: Device contributor bound to a FREE account with dual proof (A04).
      type: object
      required: [contributor_id, key_fingerprint, bound_at]
      properties:
        contributor_id:
          type: string
          description: Anonymous contributor bound by the ceremony, never client-asserted alone.
          example: c0000000-0000-4000-8000-000000000001
        key_fingerprint:
          type: string
          description: Proven device key at bind time.
          example: 'fp:9f2c4a1b3d5e6f708192a3b4c5d6e7f8091a2b3c4d5e6f708192a3b4c5d6e7f8'
        bound_at:
          type: string
          format: date-time
          example: 2026-10-01T00:00:00Z
    ProviderLink:
      description: Verified provider binding; email alone never links (A03).
      type: object
      required: [provider, subject, linked_at]
      properties:
        provider:
          type: string
          enum: [email, google, apple]
          example: google
        subject:
          type: string
          description: Provider-verified subject (sub claim), never client-supplied.
          example: '110229484794030244762'
        linked_at:
          type: string
          format: date-time
          example: 2026-10-01T00:00:00Z
    EmailCodeRequest:
      description: Six-digit code issuance; unknown addresses answer identically (no enumeration).
      type: object
      required: [email]
      example:
        email: case-01@example.invalid
      properties:
        email:
          type: string
          format: email
          example: case-01@example.invalid
    EmailCodeConsume:
      description: Single-use code redemption inside the 600s TTL with five attempts.
      type: object
      required: [email, code]
      example:
        email: case-01@example.invalid
        code: '482916'
      properties:
        email:
          type: string
          format: email
          example: case-01@example.invalid
        code:
          type: string
          pattern: '^[0-9]{6}$'
          example: '482916'
    OidcLinkRequest:
      description: Provider token plus the consumed login nonce for link/unlink proof.
      type: object
      required: [provider, id_token, nonce]
      properties:
        provider:
          type: string
          enum: [google, apple]
          example: google
        id_token:
          type: string
          description: Provider-signed JWT; issuer, audience, expiry and nonce verified server-side.
          example: eyJhbGciOiJSUzI1NiJ9.eyJzdWIiOiIxMTAyMjkifQ.c2ln
        nonce:
          type: string
          description: Single-use login nonce bound to this request.
          example: n-07
    Session:
      description: Short-lived access with a rotating refresh family (absolute 30-day ceiling).
      type: object
      required: [access_expires_at, refresh_family_id, absolute_expires_at]
      properties:
        access_expires_at:
          type: string
          format: date-time
          example: 2026-10-01T00:15:00Z
        refresh_family_id:
          type: string
          format: uuid
          example: aac027be-d331-40e4-8d63-52ec3b8d2f41
        absolute_expires_at:
          type: string
          format: date-time
          example: 2026-10-31T00:00:00Z
    SessionTokens:
      description: Issued login with opaque bearer tokens shown once at issuance.
      type: object
      required: [family_id, account_id, access_token, refresh_token, access_expires_at, absolute_expires_at]
      properties:
        family_id:
          type: string
          format: uuid
          example: aac027be-d331-40e4-8d63-52ec3b8d2f41
        account_id:
          type: string
          format: uuid
          example: d6c74c23-63db-4c24-a2e5-408cb23bad26
        access_token:
          type: string
          description: Opaque short-lived bearer token, stored hashed server-side.
          example: tok-access
        refresh_token:
          type: string
          description: Opaque rotating token; reuse revokes the family.
          example: tok-refresh
        access_expires_at:
          type: string
          format: date-time
          example: 2026-10-01T00:15:00Z
        absolute_expires_at:
          type: string
          format: date-time
          example: 2026-10-31T00:00:00Z
    AuthResult:
      description: Successful code consume with the account and one session.
      type: object
      required: [account, session, created]
      properties:
        account:
          $ref: '#/components/schemas/Account'
        session:
          $ref: '#/components/schemas/SessionTokens'
        created:
          type: boolean
          description: True when this consume created the account.
          example: true
    FeedbackRating:
      description: >
        Personal-experience stars (P14-T01, B-BR-F02): integer 1–5, one
        current rating per account/target. Preview schema only; paths
        land with handlers in P14-T02.
      type: object
      required: [station_id, product, stars]
      properties:
        station_id:
          type: string
          format: uuid
          example: d6c74c23-63db-4c24-a2e5-408cb23bad26
        product:
          type: string
          description: Catalog fuel product wire name.
          example: GASOLINE_ADDITIVED
        stars:
          type: integer
          minimum: 1
          maximum: 5
          example: 5
    FeedbackComment:
      description: >
        Plain-text comment or reply (P14-T01, B-BR-F03/F04): nonempty,
        at most 280 Unicode scalars after trim + CRLF normalization.
        Replies attach to a comment (depth one). Preview schema only;
        paths land with handlers in P14-T03.
      type: object
      required: [station_id, product, text]
      properties:
        station_id:
          type: string
          format: uuid
          example: d6c74c23-63db-4c24-a2e5-408cb23bad26
        product:
          type: string
          example: GASOLINE_ADDITIVED
        text:
          type: string
          description: Comment text; the 280-scalar bound is enforced server-side.
          example: Preço bom ⛽
        reply_to:
          type: string
          format: uuid
          description: Parent comment for one-level replies; absent for comments.
          example: bbd138ce-e442-4f57-a874-3c05d2e16f52
    FeedbackAgreement:
      description: >
        Community agreement snapshot (P14-T01, B-BR-F06): exact counts
        plus floor basis points; null percentage means no votes, never
        0% certainty. Preview schema only; projections land in P14-T04.
      type: object
      required: [valid, invalid, total]
      properties:
        valid:
          type: integer
          minimum: 0
          example: 2
        invalid:
          type: integer
          minimum: 0
          example: 1
        total:
          type: integer
          minimum: 0
          example: 3
        percentage_bps:
          type: [integer, 'null']
          description: Floor(10000*valid/total); null when total is zero.
          example: 6666
    FeedbackCommentView:
      description: >
        Public comment read shape (P14-T03, B-BR-F08): opaque author
        alias only, never account identifiers, addresses or provider
        subjects. Text travels verbatim; clients never render HTML.
      type: object
      required: [id, public_alias, station_id, product, depth, text, revision, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
          example: bbd138ce-e442-4f57-a874-3c05d2e16f52
        public_alias:
          type: string
          example: adore-fox-42
        station_id:
          type: string
          format: uuid
          example: d6c74c23-63db-4c24-a2e5-408cb23bad26
        product:
          type: string
          example: GASOLINE_ADDITIVED
        parent_id:
          type: [string, 'null']
          format: uuid
          description: Parent comment for replies; null for comments.
        depth:
          type: integer
          enum: [0, 1]
          example: 0
        text:
          type: string
          example: Preço bom ⛽
        revision:
          type: integer
          minimum: 1
          example: 1
        created_at:
          type: string
          format: date-time
          example: 2026-10-01T00:00:00Z
        updated_at:
          type: string
          format: date-time
          example: 2026-10-01T00:00:00Z
    ObservationSubmit:
      description: Submission content; identity derives from proof, never the body.
      type: object
      required: [client_submission_id, station_id, fuel_product, price, condition]
      properties:
        client_submission_id:
          type: string
          description: Client operation identity for safe retries.
          example: sub-2026-09-28-001
        station_id:
          type: string
          format: uuid
          example: d6c74c23-63db-4c24-a2e5-408cb23bad26
        fuel_product:
          $ref: '#/components/schemas/FuelProduct'
        price:
          type: object
          required: [amount_milli_brl, currency, unit]
          properties:
            amount_milli_brl:
              type: integer
              minimum: 1
              maximum: 1000000
              example: 5999
            currency:
              type: string
              enum: [BRL]
              example: BRL
            unit:
              $ref: '#/components/schemas/PriceUnit'
        condition:
          type: object
          required: [kind]
          properties:
            kind:
              type: string
              enum: [STANDARD, CASH, DEBIT, CREDIT, APP, LOYALTY, OTHER]
              example: STANDARD
            qualifier_id:
              type: [string, "null"]
              example: null
        evidence_id:
          type: [string, "null"]
          format: uuid
          example: null
        claimed_captured_at:
          type: [string, "null"]
          format: date-time
          example: null
        supersedes_observation_id:
          type: [string, "null"]
          format: uuid
          example: null
    ObservationReceipt:
      description: Safe acknowledgment; RECEIVED never claims publication.
      type: object
      required: [id, validation_state, received_at, status_url]
      properties:
        id:
          type: string
          format: uuid
          example: d6c74c23-63db-4c24-a2e5-408cb23bad27
        validation_state:
          type: string
          enum: [RECEIVED]
          example: RECEIVED
        received_at:
          type: string
          format: date-time
          example: '2026-09-28T00:00:00Z'
        status_url:
          type: string
          example: /v1/observations/d6c74c23-63db-4c24-a2e5-408cb23bad27
    Observation:
      description: Stored fact with derived validation state.
      type: object
      required: [id, station_id, fuel_product, unit, amount_milli_brl, condition, validation_state, received_at, policy_version]
      properties:
        id:
          type: string
          format: uuid
          example: d6c74c23-63db-4c24-a2e5-408cb23bad27
        station_id:
          type: string
          format: uuid
          example: d6c74c23-63db-4c24-a2e5-408cb23bad26
        fuel_product:
          $ref: '#/components/schemas/FuelProduct'
        unit:
          $ref: '#/components/schemas/PriceUnit'
        amount_milli_brl:
          type: integer
          minimum: 1
          maximum: 1000000
          example: 5999
        condition:
          type: object
          required: [kind]
          properties:
            kind:
              type: string
              enum: [STANDARD, CASH, DEBIT, CREDIT, APP, LOYALTY, OTHER]
              example: STANDARD
            qualifier_id:
              type: [string, "null"]
              example: null
        validation_state:
          type: string
          enum: [RECEIVED, VALIDATING, VALIDATED, REJECTED]
          example: RECEIVED
        received_at:
          type: string
          format: date-time
          example: '2026-09-28T00:00:00Z'
        policy_version:
          type: string
          example: community-pricing-v1
    ObservationStatus:
      description: Owned fact with state and decision timeline.
      type: object
      required: [observation, validation_state, decisions]
      properties:
        observation:
          $ref: '#/components/schemas/Observation'
        validation_state:
          type: string
          enum: [RECEIVED, VALIDATING, VALIDATED, REJECTED]
          example: RECEIVED
        decisions:
          type: array
          description: Decision timeline in sequence order.
          example: []
          items:
            type: object
            required: [sequence, to_state, occurred_at, actor]
            properties:
              sequence: {type: integer, example: 1}
              to_state: {type: string, example: VALIDATING}
              reason_codes: {type: array, items: {type: string}}
              occurred_at: {type: string, format: date-time}
              actor: {type: string, example: worker}
    ObservationHistory:
      description: Owner facts page with cursor.
      type: object
      required: [items, generated_at]
      properties:
        items:
          type: array
          description: Newest-first owner facts.
          example: []
          items: {$ref: '#/components/schemas/Observation'}
        next_cursor:
          type: [string, "null"]
          example: null
        generated_at:
          type: string
          format: date-time
          example: '2026-09-28T00:00:00Z'
    ConfirmationSubmit:
      description: Support vote; the supporter derives from proof and must differ from the author.
      type: object
      required: [client_submission_id]
      properties:
        client_submission_id:
          type: string
          minLength: 1
          description: Client operation identity for safe retries.
          example: cfm-2026-09-30-001
    ConfirmationReceipt:
      description: Recorded support, never a projection claim.
      type: object
      required: [confirmation_id, observation_id, received_at]
      properties:
        confirmation_id:
          type: string
          format: uuid
          example: c6c74c23-63db-4c24-a2e5-408cb23bad26
        observation_id:
          type: string
          format: uuid
          example: d6c74c23-63db-4c24-a2e5-408cb23bad27
        received_at:
          type: string
          format: date-time
          example: '2026-09-30T00:00:00Z'
    DisputeReason:
      description: Structured report reason; reports never erase prices.
      type: string
      enum: [PRICE_CHANGED, WRONG_STATION, WRONG_PRODUCT, WRONG_CONDITION, EVIDENCE_MISMATCH, OTHER]
      example: WRONG_PRODUCT
    DisputeSubmit:
      description: Structured report; the reporter derives from proof.
      type: object
      required: [client_submission_id, reason]
      properties:
        client_submission_id:
          type: string
          minLength: 1
          description: Client operation identity for safe retries.
          example: dsp-2026-09-30-001
        reason:
          $ref: '#/components/schemas/DisputeReason'
        detail:
          type: [string, "null"]
          example: null
        replacement_observation_id:
          type: [string, "null"]
          format: uuid
          description: Replacement reference for PRICE_CHANGED, when available.
          example: null
    DisputeReceipt:
      description: Open report, never a price change.
      type: object
      required: [dispute_id, target_observation_id, state, received_at]
      properties:
        dispute_id:
          type: string
          format: uuid
          example: e6c74c23-63db-4c24-a2e5-408cb23bad26
        target_observation_id:
          type: string
          format: uuid
          example: d6c74c23-63db-4c24-a2e5-408cb23bad27
        state:
          type: string
          enum: [OPEN]
          example: OPEN
        received_at:
          type: string
          format: date-time
          example: '2026-09-30T00:00:00Z'
    UploadReserveRequest:
      description: Upload intent; the object key is server-generated, never client-supplied.
      type: object
      required: [client_submission_id, content_type, size_bytes, sha256]
      properties:
        client_submission_id:
          type: string
          minLength: 1
          description: Client operation identity for safe retries.
          example: upl-2026-09-30-001
        content_type:
          type: string
          enum: [image/jpeg]
          example: image/jpeg
        size_bytes:
          type: integer
          minimum: 1
          maximum: 3145728
          description: Declared intent only; actual length is verified after upload.
          example: 524288
        sha256:
          type: string
          pattern: '^[0-9a-fA-F]{64}$'
          description: Client hash claim, verified after upload.
          example: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    UploadReservation:
      description: Reserved session with a short direct PUT authorization.
      type: object
      required: [upload_id, method, url, required_headers, expires_at, max_bytes]
      properties:
        upload_id:
          type: string
          format: uuid
          example: e0000000-0000-4000-8000-000000000001
        method:
          type: string
          enum: [PUT]
          example: PUT
        url:
          type: string
          format: uri
          description: Short presigned PUT bound to one quarantine key; transport only, never a size bound.
          example: https://xxx.r2.cloudflarestorage.com/anpfuel-quarantine/q/e0000000000000000000000000000001?X-Amz-Algorithm=AWS4-HMAC-SHA256
        required_headers:
          type: object
          required: [content-type]
          properties:
            content-type:
              type: string
              enum: [image/jpeg]
              example: image/jpeg
        expires_at:
          type: string
          format: date-time
          example: '2026-09-30T12:05:00Z'
        max_bytes:
          type: integer
          example: 3145728
    UploadState:
      description: Upload session lifecycle state.
      type: string
      enum: [ISSUED, VERIFYING, READY, REJECTED, EXPIRED]
      example: ISSUED
    UploadStatus:
      description: Owner session state; READY carries the evidence id, never an object URL.
      type: object
      required: [upload_id, state, updated_at]
      properties:
        upload_id:
          type: string
          format: uuid
          example: e0000000-0000-4000-8000-000000000001
        state:
          $ref: '#/components/schemas/UploadState'
        evidence_id:
          type: [string, "null"]
          format: uuid
          description: Bound evidence reference once READY; null otherwise.
          example: null
        updated_at:
          type: string
          format: date-time
          example: '2026-09-30T12:00:00Z'
  responses:
    BadRequest:
      description: Malformed input, cursor or bounds.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: Missing resource; no ownership oracle.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unauthorized:
      description: Missing or invalid proof; no detail leaks.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Forbidden:
      description: Authenticated but forbidden for this caller; no detail leaks.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Conflict:
      description: Same key, different body.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Gone:
      description: The owning account was deleted; re-signup mints a new account.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    RateLimited:
      description: Quota exhausted; honor Retry-After.
      headers:
        Retry-After:
          schema: {type: integer, example: 60}
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
