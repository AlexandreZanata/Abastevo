  /v1/accounts/deletion:
    post:
      summary: Delete the caller's FREE account.
      operationId: deleteAccount
      tags: [accounts]
      security: []
      description: >
        Rights deletion (P13-T04, BUC-A04). Session-authenticated
        self-delete only: status flips to deleted, every session family
        is revoked and address plus provider bindings drop. The account
        row stays as an audit record; later signups mint new accounts
        without reputation carryover. Suspended callers delete through
        the operator path, not this route.
      requestBody:
        required: true
        description: Live family plus its current access token.
        content:
          application/json:
            schema:
              type: object
              required: [family_id, access_token]
              properties:
                family_id:
                  type: string
                  format: uuid
                  example: aac027be-d331-40e4-8d63-52ec3b8d2f41
                access_token:
                  type: string
                  example: tok-access
      responses:
        '200':
          description: Account deleted; all sessions revoked.
          headers:
            Cache-Control:
              schema: {type: string, example: 'no-store'}
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [deleted]
                    example: deleted
        '400':
